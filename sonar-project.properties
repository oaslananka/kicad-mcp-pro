# =============================================================================
# SonarCloud Configuration — kicad-mcp-pro
# https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/analysis-parameters/
# =============================================================================

# ── Project identification ──────────────────────────────────────────────────
sonar.organization=oaslananka
sonar.projectKey=oaslananka_kicad-mcp-pro
sonar.projectName=KiCad MCP Pro
# x-release-please-start-version
sonar.projectVersion=4.20.0
# x-release-please-end

# ── Analysis scope ──────────────────────────────────────────────────────────
# Primary source: Python MCP server + Cloud and local HTML frontend
sonar.sources=src,packages,scripts,examples
sonar.tests=tests,packages/protocol-schemas/test,packages/kicad-fixtures/test

# ── Language-specific settings ──────────────────────────────────────────────
# Python (primary language)
sonar.python.version=3.13,3.14
sonar.python.coverage.reportPaths=coverage.xml

# ── Source encoding ─────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8

# ── Exclusions ──────────────────────────────────────────────────────────────
# Files/directories excluded from analysis (aligned with .gitignore)
sonar.exclusions=\
  **/node_modules/**,\
  **/.venv/**,\
  **/dist/**,\
  **/dist-test/**,\
  **/out/**,\
  **/site/**,\
  **/coverage/**,\
  **/htmlcov/**,\
  **/__pycache__/**,\
  **/.pytest_cache/**,\
  **/.mypy_cache/**,\
  **/.ruff_cache/**,\
  **/.hypothesis/**,\
  **/target/**,\
  **/gen/**,\
  **/artifacts/**,\
  **/*.png,\
  **/*.min.js,\
  **/*.whl,\
  **/*.tar.gz,\
  **/pnpm-lock.yaml,\
  **/uv.lock,\
  **/test-fixtures/**,\
  **/fuzz/**,\
  **/performance/**,\
  **/docs/**,\
  packages/protocol-schemas/test/**,\
  packages/kicad-fixtures/test/**,\
  **/.codegraph/**

# Files excluded from coverage computation
sonar.coverage.exclusions=\
  tests/**,\
  scripts/**,\
  examples/**,\
  evals/**,\
  packages/kicad-fixtures/scripts/run-tests.cjs,\
  packages/protocol-schemas/scripts/run-tests.cjs,\
  packages/kicad-plugin/context.py,\
  src/kicad_mcp/parity_matrix_data.py

# Files excluded from duplication detection
sonar.cpd.exclusions=\
  packages/kicad-plugin/context.py,\
  src/kicad_mcp/parity_matrix_data.py,\
  **/test-fixtures/**,\
  **/*.lock

# ── Project links ──────────────────────────────────────────────────────────
sonar.links.homepage=https://oaslananka.github.io/kicad-mcp-pro
sonar.links.ci=https://github.com/oaslananka/kicad-mcp-pro/actions
sonar.links.scm=https://github.com/oaslananka/kicad-mcp-pro
sonar.links.issue=https://github.com/oaslananka/kicad-mcp-pro/issues

# ── Rule exclusions ────────────────────────────────────────────────────────
# S8541 flags GitHub Actions uv commands that omit --no-build. Source builds are required:
# `uv sync --no-build` cannot install this editable project, and even with
# `--no-install-project` it cannot install tools managed outside the Python environment.
# Keep the exception limited to workflow files; do not suppress the rule for repository code.
# S107 is an intentional, measured FastMCP compatibility exception. MCP clients
# consume a flat, typed JSON tool schema, including 14 independently named
# candidate/pad/routing inputs for each paired WRITE tool. The exact external
# parameter names and defaults are locked by
# tests/unit/test_routing_manual_tracks_registration.py.
# Limit S107 exceptions to these three known tool modules; all other rules,
# security checks, and quality gates remain enabled.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4
sonar.issue.ignore.multicriteria.e1.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.e1.resourceKey=.github/workflows/**
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S107
sonar.issue.ignore.multicriteria.e2.resourceKey=src/kicad_mcp/tools/project_design_spec.py
sonar.issue.ignore.multicriteria.e3.ruleKey=python:S107
sonar.issue.ignore.multicriteria.e3.resourceKey=src/kicad_mcp/tools/routing_coupled_pair.py
sonar.issue.ignore.multicriteria.e4.ruleKey=python:S107
sonar.issue.ignore.multicriteria.e4.resourceKey=src/kicad_mcp/tools/routing_manual_tracks.py

# ── Quality settings ───────────────────────────────────────────────────────
# Verbose logging disabled for CI performance; enable for debugging:
#   sonar.verbose=true
sonar.verbose=false
sonar.scm.provider=git
