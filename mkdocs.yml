site_name: KiCad MCP Pro
site_url: https://oaslananka.github.io/kicad-mcp-pro
repo_url: https://github.com/oaslananka/kicad-mcp-pro
repo_name: oaslananka/kicad-mcp-pro
copyright: >
  &copy; 2026 oaslananka &middot;
  <a href="https://github.com/sponsors/oaslananka">Sponsor</a> &middot;
  <a href="https://www.buymeacoffee.com/oaslananka">Buy me a coffee</a>
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy
plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
  - redirects
  - glightbox
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
