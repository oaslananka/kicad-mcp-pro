<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KiCad · Synthetic Review</title>
<style>
:root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; --bg: #f2f5fa; --card: #fff; --ink: #172338; --muted: #516179; --border: #dce4ef; --accent: #2866b3; --error: #ae3c3c; --warn: #9d6114; }
:root[data-theme="dark"] { color-scheme: dark; --bg: #101824; --card: #192637; --ink: #ecf3fc; --muted: #bbc9d8; --border: #334458; --accent: #8bbcff; --error: #ff9d9d; --warn: #f1c47c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --bg: #101824; --card: #192637; --ink: #ecf3fc; --muted: #bbc9d8; --border: #334458; --accent: #8bbcff; --error: #ff9d9d; --warn: #f1c47c; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.5; }
main { padding: clamp(12px, 3vw, 20px); min-height: 180px; }
.review-panel { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: clamp(16px, 3vw, 24px); box-shadow: 0 10px 32px #0000000b; }
.eyebrow { margin: 0 0 4px; color: var(--accent); font-size: 11px; font-weight: 750; text-transform: uppercase; letter-spacing: .1em; }
.review-title { margin: 0; font-size: clamp(18px, 4vw, 24px); letter-spacing: -.03em; overflow-wrap: anywhere; line-height: 1.25; }
.disclaimer { color: var(--muted); margin: 8px 0 0; font-size: 12px; }
.review-summary { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; margin: 20px 0; }
.count { display: flex; flex-direction: column; padding: 13px 16px; border: 1px solid var(--border); border-radius: 12px; }
.count-number { font-size: 27px; font-weight: 760; line-height: 1.15; font-variant-numeric: tabular-nums; }
.count-label { color: var(--muted); font-size: 12px; text-transform: capitalize; }
.count--error .count-number { color: var(--error); } .count--warning .count-number { color: var(--warn); }
.findings-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--border); padding-bottom: 14px; }
.findings-heading { margin: 0; font-size: 15px; }
.filters { display: flex; gap: 4px; flex-wrap: wrap; }
.filter { cursor: pointer; background: transparent; border: 1px solid var(--border); border-radius: 8px; padding: 6px 11px; color: var(--ink); font: inherit; font-size: 12px; }
.filter:hover { border-color: var(--accent); } .filter[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 700; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.findings-list { padding: 0; margin: 8px 0 0; list-style: none; }
.finding { padding: 12px 0; border-bottom: 1px solid var(--border); display: grid; grid-template-columns: 68px minmax(0,1fr); gap: 2px 12px; }
.finding:last-child { border-bottom: 0; }
.finding-level { grid-row: 1 / span 2; color: var(--muted); text-transform: uppercase; font-size: 10px; font-weight: 750; padding-top: 3px; }
.finding--error .finding-level { color: var(--error); } .finding--warning .finding-level { color: var(--warn); }
.finding-code { font-size: 12px; overflow-wrap: anywhere; } .finding-message { color: var(--muted); font-size: 13px; margin: 0; overflow-wrap: anywhere; }
.no-findings { padding: 22px 0; color: var(--muted); }
.review-state { border: 1px solid var(--border); border-radius: 12px; background: var(--card); padding: 24px; }
.review-state-title { margin: 0 0 8px; font-size: 17px; } .review-state-text { margin: 0; color: var(--muted); }
@media (max-width: 360px) { .finding { grid-template-columns: 1fr; } .finding-level { grid-row: auto; } .review-summary { gap: 7px; } }
@media (prefers-reduced-motion: reduce) { *,*::before,*::after { scroll-behavior: auto!important; transition: none!important; } }
</style>
</head>
<body>
<main id="review-root" aria-live="polite"><p class="review-state">Waiting for a synthetic review result…</p></main>
<!-- APP_SCRIPT -->
</body>
</html>
