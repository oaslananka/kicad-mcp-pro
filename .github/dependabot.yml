version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Istanbul"
    cooldown:
      default-days: 5
    labels:
      - "dependencies"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      python-major:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "major"
      python-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "12:00"
      timezone: "Europe/Istanbul"
    cooldown:
      default-days: 5
    labels:
      - "dependencies"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-root-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-root-major:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "major"
      npm-root-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/integrations/chatgpt-app/apps-sdk"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "04:00"
      timezone: "Europe/Istanbul"
    cooldown:
      default-days: 5
    labels:
      - "dependencies"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-chatgpt-app-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-chatgpt-app-major:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "major"
      npm-chatgpt-app-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/packages/kicad-fixtures"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "12:00"
      timezone: "Europe/Istanbul"
    cooldown:
      default-days: 5
    labels:
      - "dependencies"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-fixtures-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-fixtures-major:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "major"
      npm-fixtures-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/packages/mcp-npm"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "04:00"
      timezone: "Europe/Istanbul"
    cooldown:
      default-days: 5
    labels:
      - "dependencies"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-wrapper-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
