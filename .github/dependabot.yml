        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "patch"
      compose-manual:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "major"

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "12:00"
      timezone: "Europe/Istanbul"
    cooldown:
      default-days: 5
    labels:
      - "dependencies"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      cargo-major:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "major"
      cargo-security:
        applies-to: "security-updates"
        patterns:
          - "*"
