version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Istanbul"
    labels:
      - "dependencies"
    open-pull-requests-limit: 4
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      python-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/packages/mcp-npm"
      - "/packages/kicad-fixtures"
      - "/integrations/chatgpt-app/apps-sdk"
      - "/integrations/opencode/plugins/kicad-mcp-plugin"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Istanbul"
    labels:
      - "dependencies"
    open-pull-requests-limit: 4
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Istanbul"
    labels:
      - "dependencies"
      - "ci"
    open-pull-requests-limit: 4
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Istanbul"
    labels:
      - "dependencies"
      - "ci"
    open-pull-requests-limit: 4
    commit-message:
      prefix: "chore(deps)"
    groups:
      containers-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "patch"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Istanbul"
    labels:
      - "dependencies"
      - "ci"
    open-pull-requests-limit: 4
    commit-message:
      prefix: "chore(deps)"
    groups:
      compose-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Istanbul"
    labels:
      - "dependencies"
    open-pull-requests-limit: 4
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      cargo-security:
        applies-to: "security-updates"
        patterns:
          - "*"
