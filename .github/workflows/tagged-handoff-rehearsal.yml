name: Tagged handoff rehearsal (non-publishing)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tagged-handoff-rehearsal-${{ github.repository }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.repository == 'oaslananka/kicad-mcp-pro' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'oaslananka' &&
      github.actor_id == '285490571' &&
      github.triggering_actor == 'oaslananka' &&
      github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    outputs:
      child: ${{ steps.dispatch.outputs.child }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Dispatch exactly one isolated tagged worker
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          python3 -m scripts.rehearse_tagged_handoff check-owner
          child="$(jq -n --arg ref "handoff-rehearsal-$GITHUB_SHA" '{ref:$ref}' |
            gh api -H 'X-GitHub-Api-Version: 2026-03-10' -X POST               repos/oaslananka/kicad-mcp-pro/actions/workflows/tagged-handoff-worker.yml/dispatches --input - |
            jq -er '.workflow_run_id | select(type == "number" and . > 0 and floor == .) | tostring')"
          [[ "$child" =~ ^[1-9][0-9]{0,14}$ && "$child" != "$GITHUB_RUN_ID" ]]
          printf 'child=%s\n' "$child" >> "$GITHUB_OUTPUT"

  sign:
    needs: dispatch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare deterministic synthetic records for returned child
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHILD: ${{ needs.dispatch.outputs.child }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          python3 -m scripts.rehearse_tagged_handoff prepare --child "$CHILD" --output request
      - name: Attest both rehearsal records
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: request/*.json
      - name: Store exact signed rehearsal request
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tagged-handoff-request-1-${{ needs.dispatch.outputs.child }}
          path: request/*.json
          if-no-files-found: error
          retention-days: 3

  receipt:
    needs: [dispatch, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact completed tagged worker receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHILD: ${{ needs.dispatch.outputs.child }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          artifact="$(python3 -m scripts.rehearse_tagged_handoff wait-receipt --child "$CHILD")"
          [[ "$artifact" =~ ^[1-9][0-9]{0,14}$ ]]
          scratch="$(mktemp -d)"
          trap 'rm -f -- "$scratch/receipt.zip"; rmdir -- "$scratch"' EXIT
          gh api "repos/oaslananka/kicad-mcp-pro/actions/artifacts/$artifact/zip" |
            head -c 65537 > "$scratch/receipt.zip"
          python3 -m scripts.rehearse_tagged_handoff verify-receipt --child "$CHILD"             --artifact-id "$artifact" --archive "$scratch/receipt.zip"
