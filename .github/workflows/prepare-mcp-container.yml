name: Prepare MCP container build (non-publishing)

on:
  workflow_call:
    inputs:
      tag:
        description: Existing protected mcp-server-vX.Y.Z tag.
        required: true
        type: string
      source_commit:
        description: Exact reviewed main source SHA for the tag.
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    if: >-
      github.repository == 'oaslananka/kicad-mcp-pro' &&
      github.ref == 'refs/heads/main' &&
      inputs.source_commit != '' &&
      startsWith(inputs.tag, 'mcp-server-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify container source identity
        id: source
        shell: bash
        env:
          EXPECTED_TAG: ${{ inputs.tag }}
          EXPECTED_SOURCE: ${{ inputs.source_commit }}
          CALLER_SHA: ${{ github.sha }}
          CALLER_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_TAG" =~ ^mcp-server-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$CALLER_REF" == "refs/heads/main" ]] || exit 1
          [[ "$CALLER_SHA" == "$EXPECTED_SOURCE" ]] || exit 1
          checked_out="$(git rev-parse HEAD)" || exit 1
          [[ "$checked_out" == "$EXPECTED_SOURCE" ]] || exit 1
          tagged_source="$(git rev-list -n 1 "refs/tags/${EXPECTED_TAG}^{commit}")" || exit 1
          [[ "$tagged_source" == "$EXPECTED_SOURCE" ]] || exit 1
          expected_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" || exit 1
          [[ "$EXPECTED_TAG" == "mcp-server-v$expected_version" ]] || exit 1
          echo "version=$expected_version" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: false
          version-file: uv.toml
      - name: Verify live-model release readiness
        run: |
          set -euo pipefail
          uv sync --all-extras --frozen
          uv run --all-extras python scripts/check_live_model_release_policy.py --require-ready release --ref HEAD
          uv run --all-extras python scripts/check_docker_metadata.py
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          image: tonistiigi/binfmt:qemu-v10.0.4@sha256:8f58e6214f4cc9dc83ce8f5acad1ece508eb6b20e696a8c1e9f274481982c541
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          driver-opts: image=moby/buildkit:v0.26.2@sha256:de10faf919fc71ba4eb1dd7bd6449566d012b0c9436b1c61bfee21d621b009aa
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        id: meta
        with:
          images: ghcr.io/oaslananka/kicad-mcp-pro
          tags: type=raw,value=${{ steps.source.outputs.version }}
      - name: Validate both container architectures without exporting an image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=cacheonly
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            KICAD_MCP_VERSION=${{ steps.source.outputs.version }}
            VCS_REF=${{ github.sha }}
          sbom: true
          provenance: mode=max
      # Cache-only output has no published OCI image digest. These signed
      # records describe the reviewed source and build mode, not GHCR receipts.
      - name: Stage container build-source evidence
        shell: bash
        env:
          EXPECTED_TAG: ${{ inputs.tag }}
          EXPECTED_SOURCE: ${{ inputs.source_commit }}
          EXPECTED_VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          evidence_dir="release-assets/mcp-container"
          mkdir -p "$evidence_dir"
          cp -- Dockerfile docker-entrypoint.sh pyproject.toml uv.lock "$evidence_dir/"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          target = Path("release-assets/mcp-container/build-source.json")
          target.write_text(
              json.dumps(
                  {
                      "tag": os.environ["EXPECTED_TAG"],
                      "source_commit": os.environ["EXPECTED_SOURCE"],
                      "version": os.environ["EXPECTED_VERSION"],
                      "image": "ghcr.io/oaslananka/kicad-mcp-pro",
                      "platforms": ["linux/amd64", "linux/arm64"],
                      "mode": "cacheonly",
                      "published_image_digest": None,
                  },
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          (cd "$evidence_dir" && sha256sum -- Dockerfile docker-entrypoint.sh pyproject.toml uv.lock build-source.json > SHA256SUMS.txt)
          (cd "$evidence_dir" && sha256sum --check SHA256SUMS.txt)
      - name: Attest container build-source evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-checksums: release-assets/mcp-container/SHA256SUMS.txt
      - name: Store container build-source evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: container-build-source-evidence
          path: release-assets/mcp-container/
          if-no-files-found: error
          retention-days: 14
