name: Release Validation

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/publish-*.yml"
      - ".github/workflows/release-please.yml"
      - "release-please-config.json"
      - ".release-please-manifest.json"
      - "pyproject.toml"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "package.json"
      - "server.json"
      - "compatibility.yaml"
      - "ROADMAP.md"
      - "docs/faq.md"
      - "scripts/sync_mcp_metadata.py"
      - "scripts/check_release_preflight.py"
      - "docs/development/release-process.md"
      - "docs/security/release-integrity.md"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: false
          version-file: uv.toml
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: uv sync --all-extras --frozen
      - run: corepack pnpm run metadata:check
      - run: corepack pnpm run release:check
      - run: corepack pnpm run package:check
