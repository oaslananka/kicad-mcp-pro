name: Release Validation

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/publish-*.yml"
      - ".github/workflows/release-please.yml"
      - "release-please-config.json"
      - ".release-please-manifest.json"
      - "pyproject.toml"
      - "packages/mcp-npm/package.json"
      - "packages/mcp-npm/README.md"
      - "package.json"
      - "server.json"
      - "compatibility.yaml"
      - "ROADMAP.md"
      - "docs/faq.md"
      - "scripts/sync_mcp_metadata.py"
      - "scripts/check_release_preflight.py"
      - "scripts/check_live_model_release_policy.py"
      - "evals/live/release-policy.yaml"
      - "evals/live/baselines.yaml"
      - "scripts/build_kicad_pcm.py"
      - "packaging/kicad-pcm/**"
      - "packages/kicad-plugin/**"
      - "docs/development/release-process.md"
      - "docs/security/release-integrity.md"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: false
          version-file: uv.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Setup pinned pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.28.6
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-extras --frozen
      - name: Enforce live-model release readiness
        if: github.event_name == 'release' || startsWith(github.head_ref, 'release-please--')
        run: uv run --all-extras python scripts/check_live_model_release_policy.py --require-ready release --ref HEAD
      - run: pnpm run metadata:check
      - run: pnpm run release:check
      - run: pnpm run package:check
