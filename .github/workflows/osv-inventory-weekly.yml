name: OSV Full Dependency Inventory

# Inventory-only across all lockfiles. The existing RustSec CI baseline is
# strict and rejects unexpected Rust advisories; this workflow never ignores
# or suppresses OSV findings.
on:
  schedule:
    - cron: "47 7 * * 4"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: osv-full-inventory-weekly-main
  cancel-in-progress: false

jobs:
  osv-full-inventory:
    if: github.repository == 'oaslananka/kicad-mcp-pro'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout source for reproducible inventory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Scan all repository lockfiles with pinned OSV-Scanner 2.7.0
        id: scan
        uses: google/osv-scanner-action/osv-scanner-action@9a96bc4d2b09685b6142bcfe25a3dc17cb2d7347
        env:
          GOTOOLCHAIN: auto
        with:
          scan-args: |
            --output=results.json
            --format=json
            --config=.github/security/osv-full-inventory.toml
            -r
            ./
        continue-on-error: true

      - name: Reject scanner failures without a result document
        if: steps.scan.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s results.json ]]; then
            echo "::error::OSV scan exited without writing an inventory; do not report an empty scan."
            exit 1
          fi

      - name: Produce SARIF without hiding reviewed Rust findings
        uses: google/osv-scanner-action/osv-reporter-action@0a65f82af05cd58cf587827b0bb0489548c18346
        with:
          scan-args: |
            --output=results.sarif
            --new=results.json
            --gh-annotations=false
            --fail-on-vuln=false

      - name: Store auditable OSV SARIF for 5 days
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: osv-full-inventory-sarif
          path: results.sarif
          if-no-files-found: error
          retention-days: 5

      - name: Publish every finding in GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          sarif_file: results.sarif
