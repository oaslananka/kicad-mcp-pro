name: Prepare GUI (non-publishing)

# Prepared installers are Actions artifacts only. This workflow must never
# create/publish a GitHub Release, mint a publication token or upload to a registry.
on:
  workflow_call:
    inputs:
      tag:
        description: Existing protected kicad-mcp-gui-vX.Y.Z tag.
        required: true
        type: string
      source_commit:
        description: Exact reviewed main SHA to which the GUI tag resolves.
        required: true
        type: string
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: prepare-gui-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  source:
    if: >-
      github.repository == 'oaslananka/kicad-mcp-pro' &&
      github.ref == 'refs/heads/main' &&
      inputs.source_commit != '' &&
      startsWith(inputs.tag, 'kicad-mcp-gui-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify GUI preparation source identity
        shell: bash
        env:
          EXPECTED_TAG: ${{ inputs.tag }}
          EXPECTED_SOURCE: ${{ inputs.source_commit }}
          CALLER_SHA: ${{ github.sha }}
          CALLER_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_TAG" =~ ^kicad-mcp-gui-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$CALLER_REF" == "refs/heads/main" ]] || exit 1
          [[ "$CALLER_SHA" == "$EXPECTED_SOURCE" ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SOURCE" ]] || exit 1
          [[ "$(git rev-list -n 1 "refs/tags/${EXPECTED_TAG}^{commit}")" == "$EXPECTED_SOURCE" ]] || exit 1
          version="$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')" || exit 1
          cargo_version="$(python3 -c 'import tomllib; print(tomllib.load(open("src-tauri/Cargo.toml", "rb"))["package"]["version"])')" || exit 1
          [[ "$EXPECTED_TAG" == "kicad-mcp-gui-v$version" ]] || exit 1
          [[ "$cargo_version" == "$version" ]] || exit 1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: false
          version-file: uv.toml
      - run: uv sync --all-extras --frozen
      - name: Enforce live-model release readiness
        run: uv run --all-extras python scripts/check_live_model_release_policy.py --require-ready release --ref HEAD

  tauri-build:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact-name: gui-linux-tauri
          - os: windows-2025
            artifact-name: gui-windows-tauri
          - os: macos-15
            artifact-name: gui-macos-tauri
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Verify checked-out GUI source
        shell: bash
        env:
          EXPECTED_SOURCE: ${{ inputs.source_commit }}
          CALLER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$CALLER_SHA" == "$EXPECTED_SOURCE" ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SOURCE" ]] || exit 1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: false
          version-file: uv.toml
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.{list,sources}
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install pinned Python dependencies
        run: uv sync --all-extras --frozen
      - name: Verify locked Tauri dependencies
        working-directory: src-tauri
        run: cargo metadata --locked --format-version 1 --no-deps
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "2.12.0" --locked
      - name: Build Tauri installers
        working-directory: src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SKIP_CODESIGNING: ${{ runner.os == 'macOS' && '1' || '' }}
        run: cargo tauri build -- --locked
      - name: Store non-publishing GUI bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/wix/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  attest-and-store:
    needs: tauri-build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      artifact-metadata: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify GUI evidence source identity
        shell: bash
        env:
          EXPECTED_SOURCE: ${{ inputs.source_commit }}
          CALLER_SHA: ${{ github.sha }}
          EXPECTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$CALLER_SHA" == "$EXPECTED_SOURCE" ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SOURCE" ]] || exit 1
          [[ "$EXPECTED_TAG" =~ ^kicad-mcp-gui-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$(git rev-list -n 1 "refs/tags/${EXPECTED_TAG}^{commit}")" == "$EXPECTED_SOURCE" ]] || exit 1
      - name: Download exact-run GUI builder bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: gui-*-tauri
          path: artifacts
          merge-multiple: false
      - name: Validate and stage complete GUI installer inventory
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/stage_gui_draft_assets.py --release-tag "$RELEASE_TAG"
      - name: Generate GUI draft evidence
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SOURCE: ${{ inputs.source_commit }}
        run: |
          python3 scripts/generate_gui_release_evidence.py generate \
            --artifact-dir release-assets \
            --output-dir release-evidence/gui \
            --cargo-lock src-tauri/Cargo.lock \
            --source-commit "$EXPECTED_SOURCE" \
            --release-tag "$RELEASE_TAG"
      - name: Verify GUI draft evidence
        run: |
          python3 scripts/generate_gui_release_evidence.py verify-local \
            --artifact-dir release-assets \
            --evidence-dir release-evidence/gui
      - name: Attest GUI SLSA build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-checksums: release-evidence/gui/kicad-mcp-pro-gui-SHA256SUMS.txt
      - name: Attest GUI installers
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-checksums: release-evidence/gui/kicad-mcp-pro-gui-SHA256SUMS.txt
          sbom-path: release-evidence/gui/kicad-mcp-pro-gui-sbom.cdx.json
      - name: Store GUI draft installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gui-draft-installers
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
      - name: Store GUI draft checksums and attestable evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gui-draft-evidence
          path: release-evidence/gui/*
          if-no-files-found: error
          retention-days: 14
