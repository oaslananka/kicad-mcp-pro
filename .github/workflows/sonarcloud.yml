# ---------------------------------------------------------------------------
# SonarCloud analysis — runs on every push to main and on trusted same-repository PRs.
# Requires SONAR_TOKEN repository secret; Dependabot/fork PRs cannot receive it.
# ---------------------------------------------------------------------------
name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read      # checkout
  pull-requests: read # PR decoration

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: SonarCloud Scan
    if: >
      (github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops') &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0  # full history for accurate blame / new-code detection
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
          prune-cache: true
          version-file: uv.toml

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      # Keep an independent full-suite coverage run: cross-workflow artifact reuse must
      # preserve exact-SHA integrity and the existing PR/fork trust boundary.
      - name: Run tests with coverage
        run: uv run --all-extras --frozen python scripts/run_pytest.py full

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
