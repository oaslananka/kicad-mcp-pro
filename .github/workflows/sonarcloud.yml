# ---------------------------------------------------------------------------
# SonarCloud analysis — runs on every push to main and on trusted same-repository PRs.
# Requires SONAR_TOKEN repository secret; Dependabot/fork PRs cannot receive it.
# ---------------------------------------------------------------------------
name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read      # checkout
  pull-requests: read # PR decoration

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-24.04
    outputs:
      release_metadata_only: ${{ steps.release-classifier.outputs.release_metadata_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect release metadata-only change set
        id: release-classifier
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            base_sha="$(git rev-parse HEAD^1)"
            head_sha="$(git rev-parse HEAD^2)"
          else
            base_sha="$BEFORE_SHA"
            head_sha="$(git rev-parse HEAD)"
            if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
              base_sha="$(git rev-parse HEAD^)"
            fi
          fi
          git diff --name-only "$base_sha" "$head_sha" > "${RUNNER_TEMP}/changed-paths.txt"
          if python scripts/check_release_please_metadata_only.py \
            --paths-file "${RUNNER_TEMP}/changed-paths.txt"; then
            echo 'release_metadata_only=true' >> "$GITHUB_OUTPUT"
          else
            echo 'release_metadata_only=false' >> "$GITHUB_OUTPUT"
          fi

  sonarcloud:
    name: SonarCloud Scan
    needs: classify
    if: >
      needs.classify.outputs.release_metadata_only != 'true' &&
      (github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops') &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0  # full history for accurate blame / new-code detection
          persist-credentials: false

      # Keep an independent full-suite coverage run: cross-workflow artifact reuse must
      # preserve exact-SHA integrity and the existing PR/fork trust boundary.
      - name: Run tests with coverage
        uses: ./.github/actions/python-full-suite

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
