name: Publish MCP Container

on:
  pull_request:
    paths:
      - Dockerfile
      - docker-entrypoint.sh
      - pyproject.toml
      - uv.lock
      - src/**
      - scripts/check_docker_metadata.py
      - .github/workflows/publish-mcp-container.yml
      - docs/deployment/docker.md
      - docs/install/docker.md
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish an existing released mcp-server tag to GHCR.
        type: boolean
        default: false
      release_tag:
        description: Existing published mcp-server tag used when publish is true.
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: publish-mcp-container-${{ github.ref }}
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/oaslananka/kicad-mcp-pro
  STABLE_LATEST_IMAGE: ghcr.io/oaslananka/kicad-mcp-pro:latest

jobs:
  build:
    if: >-
      (github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops') &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish != true))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Resolve image version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "Invalid image version: $version" >&2
              exit 1
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          image: tonistiigi/binfmt:qemu-v10.0.4@sha256:8f58e6214f4cc9dc83ce8f5acad1ece508eb6b20e696a8c1e9f274481982c541

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          driver-opts: image=moby/buildkit:v0.26.2@sha256:de10faf919fc71ba4eb1dd7bd6449566d012b0c9436b1c61bfee21d621b009aa

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        id: meta
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: type=raw,value=${{ steps.version.outputs.version }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=cacheonly
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            KICAD_MCP_VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.sha }}

  publish:
    if: >-
      (github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops') &&
      ((github.event_name == 'release' && startsWith(github.event.release.tag_name, 'mcp-server-v')) ||
       (github.event_name == 'workflow_dispatch' && inputs.publish == true &&
        startsWith(inputs.release_tag, 'mcp-server-v')))
    runs-on: ubuntu-24.04
    environment: ghcr
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}

      - name: Verify immutable release source
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            mcp-server-v*) version="${RELEASE_TAG#mcp-server-v}" ;;
            *)
              echo "Unexpected MCP server release tag: $RELEASE_TAG" >&2
              exit 1
              ;;
          esac
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "Invalid image version: $version" >&2
              exit 1
              ;;
          esac
          tag_sha="$(git rev-list -n1 "refs/tags/${RELEASE_TAG}")"
          head_sha="$(git rev-parse HEAD)"
          test "$tag_sha" = "$head_sha"
          gh release view "$RELEASE_TAG" --json isDraft,tagName --jq 'select(.isDraft == false) | .tagName' | grep -Fx "$RELEASE_TAG"
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$version" = "$project_version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$head_sha" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: false
          version-file: uv.toml
      - name: Install release-readiness dependencies
        run: uv sync --all-extras --frozen
      - name: Enforce live-model release readiness
        run: uv run --all-extras python scripts/check_live_model_release_policy.py --require-ready release --ref HEAD

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          image: tonistiigi/binfmt:qemu-v10.0.4@sha256:8f58e6214f4cc9dc83ce8f5acad1ece508eb6b20e696a8c1e9f274481982c541

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          driver-opts: image=moby/buildkit:v0.26.2@sha256:de10faf919fc71ba4eb1dd7bd6449566d012b0c9436b1c61bfee21d621b009aa

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        id: meta
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=${{ steps.source.outputs.version }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        id: build-push
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            KICAD_MCP_VERSION=${{ steps.source.outputs.version }}
            VCS_REF=${{ steps.source.outputs.sha }}
          sbom: true
          provenance: mode=max

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.GHCR_IMAGE }}@${{ steps.build-push.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
          version: v0.70.0

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6

      - name: Sign image digest
        env:
          COSIGN_EXPERIMENTAL: "true"
          IMAGE_DIGEST: ${{ steps.build-push.outputs.digest }}
        run: cosign sign --yes "${GHCR_IMAGE}@${IMAGE_DIGEST}"
