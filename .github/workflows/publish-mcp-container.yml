name: Publish MCP Container

on:
  pull_request:
    paths:
      - Dockerfile
      - docker-entrypoint.sh
      - pyproject.toml
      - uv.lock
      - src/**
      - scripts/check_docker_metadata.py
      - .github/workflows/publish-mcp-container.yml
      - docs/deployment/docker.md
      - docs/install/docker.md
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the image to GHCR.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-mcp-container-${{ github.ref }}
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/oaslananka/kicad-mcp-pro
  STABLE_LATEST_IMAGE: ghcr.io/oaslananka/kicad-mcp-pro:latest

jobs:
  build:
    if: >-
      (github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops') &&
      (github.event_name == 'pull_request' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'release' &&
        startsWith(github.event.release.tag_name, 'mcp-server-v')))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Resolve image version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            case "$RELEASE_TAG" in
              mcp-server-v*) version="${RELEASE_TAG#mcp-server-v}" ;;
              *)
                echo "Unexpected MCP server release tag: $RELEASE_TAG" >&2
                exit 1
                ;;
            esac
          else
            version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          fi
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "Invalid image version: $version" >&2
              exit 1
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8
        with:
          image: tonistiigi/binfmt:qemu-v10.0.4@sha256:8f58e6214f4cc9dc83ce8f5acad1ece508eb6b20e696a8c1e9f274481982c541

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
        with:
          driver-opts: image=moby/buildkit:v0.26.2@sha256:de10faf919fc71ba4eb1dd7bd6449566d012b0c9436b1c61bfee21d621b009aa

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        id: meta
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'mcp-server-v')) || (github.event_name == 'workflow_dispatch' && inputs.publish == true) }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.publish != true)
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=cacheonly
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            KICAD_MCP_VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.sha }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        id: build-push
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            KICAD_MCP_VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.sha }}
          sbom: true
          provenance: mode=max

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
        with:
          image-ref: ${{ env.GHCR_IMAGE }}@${{ steps.build-push.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
          version: v0.70.0

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
        with:
          cosign-release: v3.0.6

      - name: Sign image digest
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
        env:
          COSIGN_EXPERIMENTAL: "true"
          IMAGE_DIGEST: ${{ steps.build-push.outputs.digest }}
        run: cosign sign --yes "${GHCR_IMAGE}@${IMAGE_DIGEST}"
