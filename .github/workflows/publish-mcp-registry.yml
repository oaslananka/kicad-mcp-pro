name: Publish MCP Registry

on:
  pull_request:
    paths:
      - server.json
      - pyproject.toml
      - src/kicad_mcp/__init__.py
      - scripts/publish_mcp_registry.py
      - scripts/validate_mcp_manifest.py
      - .github/workflows/publish-mcp-registry.yml
      - docs/submission/openai-mcp-registry.md
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and print the registry payload without publishing.
        type: boolean
        default: true
      release_tag:
        description: Existing published mcp-server release tag used when dry_run is false.
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: publish-mcp-registry-${{ github.ref }}
  cancel-in-progress: false

env:
  MCP_PUBLISHER_VERSION: v1.7.9
  MCP_PUBLISHER_LINUX_AMD64_SHA256: ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac

jobs:
  dry-run:
    if: (github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops') && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == true))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: false
          version-file: uv.toml
      - run: uv sync --all-extras --frozen
      - run: uv run --all-extras python scripts/validate_mcp_manifest.py server.json
      - run: uv run --all-extras python scripts/publish_mcp_registry.py --dry-run

  publish:
    if: >-
      (github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops') &&
      ((github.event_name == 'release' && startsWith(github.event.release.tag_name, 'mcp-server-v')) ||
       (github.event_name == 'workflow_dispatch' && inputs.dry_run != true &&
        startsWith(inputs.release_tag, 'mcp-server-v')))
    runs-on: ubuntu-24.04
    environment: mcp-registry
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
      - name: Verify immutable release source
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            mcp-server-v*) ;;
            *)
              echo "Unexpected MCP server release tag: $RELEASE_TAG" >&2
              exit 1
              ;;
          esac
          tag_sha="$(git rev-list -n1 "refs/tags/${RELEASE_TAG}")"
          head_sha="$(git rev-parse HEAD)"
          test "$tag_sha" = "$head_sha"
          gh release view "$RELEASE_TAG" --json isDraft,tagName --jq 'select(.isDraft == false) | .tagName' | grep -Fx "$RELEASE_TAG"
          version="${RELEASE_TAG#mcp-server-v}"
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$version" = "$project_version"
          echo "sha=$head_sha" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: false
          version-file: uv.toml
      - run: uv sync --all-extras --frozen
      - name: Enforce live-model release readiness
        run: uv run --all-extras python scripts/check_live_model_release_policy.py --require-ready release --ref HEAD
      - name: Install mcp-publisher
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" -o mcp-publisher.tar.gz
          echo "${MCP_PUBLISHER_LINUX_AMD64_SHA256}  mcp-publisher.tar.gz" | sha256sum --check --strict
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher
          mkdir -p "$HOME/.local/bin"
          mv mcp-publisher "$HOME/.local/bin/mcp-publisher"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv run --all-extras python scripts/validate_mcp_manifest.py server.json
      - name: Verify package artifacts before registry publish
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"

          for attempt in {1..30}; do
            if python -c "import json, tomllib, urllib.request; version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']; payload = json.load(urllib.request.urlopen(f'https://pypi.org/pypi/kicad-mcp-pro/{version}/json', timeout=30)); assert payload['info']['version'] == version" \
              && npm view "kicad-mcp-pro@${version}" version --json \
              && docker buildx imagetools inspect "ghcr.io/oaslananka/kicad-mcp-pro:${version}"; then
              exit 0
            fi
            echo "Package artifacts for ${version} are not ready yet (attempt ${attempt}/30)."
            sleep 20
          done

          echo "Package artifacts for ${version} were not available after waiting." >&2
          exit 1
      - run: uv run --all-extras python scripts/publish_mcp_registry.py
