name: Live Model Release Gate

on:
  workflow_dispatch:
    inputs:
      repeats:
        description: Full-corpus repetitions per configuration, bounded from 3 to 5.
        type: number
        default: 3
        required: true

permissions:
  contents: read

concurrency:
  group: live-model-release-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate protected dispatch
        env:
          GITHUB_REF_VALUE: ${{ github.ref }}
          REPEATS: ${{ inputs.repeats }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_VALUE" = "refs/heads/main"
          test "$REPEATS" -ge 3
          test "$REPEATS" -le 5

  smoke:
    name: Live model smoke (${{ matrix.configuration }})
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: live-model-evals
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        configuration:
          - nvidia-nemotron-3-5-lightning-30b-a3b
          - opencode-cli-deepseek-v4-flash-free
          - opencode-cli-nemotron-3-ultra-free
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: false
          version-file: uv.toml
      - run: uv sync --all-extras --frozen
      - name: Install pinned OpenCode CLI
        if: startsWith(matrix.configuration, 'opencode-cli-')
        env:
          OPENCODE_CLI_VERSION: "1.18.10"
        run: |
          set -euo pipefail
          npm ci --prefix evals/live --ignore-scripts --no-audit --no-fund
          test "$(evals/live/node_modules/opencode-linux-x64/bin/opencode --version)" = "$OPENCODE_CLI_VERSION"
          echo "$GITHUB_WORKSPACE/evals/live/node_modules/opencode-linux-x64/bin" >> "$GITHUB_PATH"
      - name: Run bounded live smoke
        env:
          CONFIGURATION_ID: ${{ matrix.configuration }}
          NVIDIA_API_KEY: ${{ startsWith(matrix.configuration, 'nvidia-') && secrets.NVIDIA_API_KEY || '' }}
          OPENCODE_ZEN_API_KEY: ${{ startsWith(matrix.configuration, 'opencode-cli-') && secrets.OPENCODE_ZEN_API_KEY || '' }}
        run: |
          set -euo pipefail
          case "$CONFIGURATION_ID" in
            nvidia-*) test -n "$NVIDIA_API_KEY" ;;
            opencode-cli-*) test -n "$OPENCODE_ZEN_API_KEY" ;;
            *) echo "Unsupported blocking configuration: $CONFIGURATION_ID" >&2; exit 2 ;;
          esac
          mkdir -p artifacts/live-model-smoke
          python - "$CONFIGURATION_ID" "$GITHUB_SHA" <<'PY'
          import json
          import pathlib
          import sys
          pathlib.Path("artifacts/live-model-smoke/status.json").write_text(
              json.dumps(
                  {
                      "configuration_id": sys.argv[1],
                      "source_revision": sys.argv[2],
                      "state": "running",
                      "runner_exit_code": None,
                  },
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY
          set +e
          timeout --signal=TERM --kill-after=30s 45m \
            uv run --all-extras python scripts/run_live_model_eval.py \
              --config evals/live/configurations.yaml \
              --configuration "$CONFIGURATION_ID" \
              --repeats 1 \
              --case-tag live-smoke \
              --source-revision "$GITHUB_SHA" \
              --output artifacts/live-model-smoke/evidence.json
          exit_code=$?
          set -e
          python - "$CONFIGURATION_ID" "$GITHUB_SHA" "$exit_code" <<'PY'
          import json
          import pathlib
          import sys
          exit_code = int(sys.argv[3])
          if exit_code not in (124, 137):
              pathlib.Path("artifacts/live-model-smoke/status.json").write_text(
                  json.dumps(
                      {
                          "configuration_id": sys.argv[1],
                          "source_revision": sys.argv[2],
                          "state": "completed",
                          "runner_exit_code": exit_code,
                      },
                      sort_keys=True,
                  ) + "\n",
                  encoding="utf-8",
              )
          PY
      - name: Upload sanitized smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: live-model-smoke-${{ matrix.configuration }}-${{ github.run_id }}
          path: artifacts/live-model-smoke
          if-no-files-found: error
          retention-days: 7
      - name: Enforce smoke result
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib
          status = json.loads(
              pathlib.Path("artifacts/live-model-smoke/status.json").read_text(encoding="utf-8")
          )
          if status.get("state") != "completed" or status.get("runner_exit_code") != 0:
              raise SystemExit("live-model smoke did not pass")
          PY

  benchmark:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: live-model-evals
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        configuration:
          - nvidia-nemotron-3-5-lightning-30b-a3b
          - opencode-cli-deepseek-v4-flash-free
          - opencode-cli-nemotron-3-ultra-free
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: false
          version-file: uv.toml
      - run: uv sync --all-extras --frozen
      - name: Install pinned OpenCode CLI
        if: startsWith(matrix.configuration, 'opencode-cli-')
        env:
          OPENCODE_CLI_VERSION: "1.18.10"
        run: |
          set -euo pipefail
          npm ci --prefix evals/live --ignore-scripts --no-audit --no-fund
          test "$(evals/live/node_modules/opencode-linux-x64/bin/opencode --version)" = "$OPENCODE_CLI_VERSION"
          echo "$GITHUB_WORKSPACE/evals/live/node_modules/opencode-linux-x64/bin" >> "$GITHUB_PATH"
      - name: Run bounded live benchmark
        env:
          CONFIGURATION_ID: ${{ matrix.configuration }}
          NVIDIA_API_KEY: ${{ startsWith(matrix.configuration, 'nvidia-') && secrets.NVIDIA_API_KEY || '' }}
          OPENCODE_ZEN_API_KEY: ${{ startsWith(matrix.configuration, 'opencode-cli-') && secrets.OPENCODE_ZEN_API_KEY || '' }}
          REPEATS: ${{ inputs.repeats }}
        run: |
          set -euo pipefail
          case "$CONFIGURATION_ID" in
            nvidia-*) test -n "$NVIDIA_API_KEY" ;;
            opencode-cli-*) test -n "$OPENCODE_ZEN_API_KEY" ;;
            *) echo "Unsupported blocking configuration: $CONFIGURATION_ID" >&2; exit 2 ;;
          esac
          mkdir -p artifacts/live-model-eval
          python - "$CONFIGURATION_ID" "$GITHUB_SHA" <<'PY'
          import json
          import pathlib
          import sys
          pathlib.Path("artifacts/live-model-eval/status.json").write_text(
              json.dumps(
                  {
                      "configuration_id": sys.argv[1],
                      "source_revision": sys.argv[2],
                      "state": "running",
                      "runner_exit_code": None,
                  },
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY
          set +e
          uv run --all-extras python scripts/run_live_model_eval.py \
            --config evals/live/configurations.yaml \
            --configuration "$CONFIGURATION_ID" \
            --repeats "$REPEATS" \
            --source-revision "$GITHUB_SHA" \
            --output artifacts/live-model-eval/evidence.json
          exit_code=$?
          set -e
          python - "$CONFIGURATION_ID" "$exit_code" <<'PY'
          import json
          import pathlib
          import sys
          pathlib.Path("artifacts/live-model-eval/status.json").write_text(
              json.dumps(
                  {
                      "configuration_id": sys.argv[1],
                      "state": "completed",
                      "runner_exit_code": int(sys.argv[2]),
                  },
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upload sanitized configuration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: live-model-release-${{ matrix.configuration }}-${{ github.run_id }}
          path: artifacts/live-model-eval
          if-no-files-found: error
          retention-days: 14

  aggregate:
    if: ${{ always() && needs.smoke.result == 'success' }}
    needs: [smoke, benchmark]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
          prune-cache: true
          version-file: uv.toml
      - run: uv sync --all-extras --frozen
      - name: Download sanitized configuration evidence
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: live-model-release-*-${{ github.run_id }}
          path: artifacts/downloaded
      - name: Evaluate aggregate non-regression gate
        if: always()
        id: gate
        continue-on-error: true
        run: |
          set -euo pipefail
          uv run --all-extras python scripts/evaluate_live_model_release_gate.py \
            --evidence-root artifacts/downloaded \
            --output artifacts/live-model-release-gate/report.json
      - name: Upload sanitized aggregate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: live-model-release-gate-${{ github.run_id }}
          path: artifacts/live-model-release-gate/report.json
          if-no-files-found: error
          retention-days: 30
      - name: Generate reviewed baseline candidate
        if: always()
        id: baseline-candidate
        continue-on-error: true
        run: |
          set -euo pipefail
          uv run --all-extras python scripts/generate_live_model_baseline.py \
            --aggregate-report artifacts/live-model-release-gate/report.json \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --approved-at "$(date -u +%F)" \
            --output artifacts/live-model-release-gate/baselines.candidate.yaml
      - name: Upload reviewed baseline candidate
        if: steps.baseline-candidate.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: live-model-baseline-candidate-${{ github.run_id }}
          path: artifacts/live-model-release-gate/baselines.candidate.yaml
          if-no-files-found: error
          retention-days: 30
      - name: Enforce gate result
        if: always()
        env:
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          set -euo pipefail
          test "$GATE_OUTCOME" = "success"
