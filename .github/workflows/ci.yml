name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      docs_only: ${{ steps.check.outputs.docs_only }}
      python: ${{ steps.filter.outputs.python }}
      npm: ${{ steps.filter.outputs.npm }}
      chatgpt_app: ${{ steps.filter.outputs.chatgpt_app }}
      schemas: ${{ steps.filter.outputs.schemas }}
      workflows: ${{ steps.filter.outputs.workflows }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          filters: |
            python:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'uv.toml'
              - 'scripts/**'
              - 'conftest.py'
              - 'pyrightconfig.json'
              - '.python-version'
              - 'performance/**'
              - 'evals/**'
            npm:
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.node-version'
              - '.npmrc'
              - 'commitlint.config.cjs'
              - '.commitlintrc.json'
            chatgpt_app:
              - 'integrations/chatgpt-app/apps-sdk/**'
              - 'tests/unit/test_chatgpt_app_contract.py'
              - '.github/workflows/ci.yml'
            schemas:
              - 'packages/protocol-schemas/**'
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.github/actions-policy.json'
              - 'codecov.yml'
            dependencies:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Dockerfile'
              - '.github/dependabot.yml'
            docs:
              - 'docs/**'
              - 'README.md'
              - 'CONTRIBUTING.md'
              - 'CHANGELOG.md'
              - 'CODE_OF_CONDUCT.md'
              - 'GOVERNANCE.md'
              - 'MAINTAINERS.md'
              - 'ROADMAP.md'
              - 'SECURITY.md'
              - 'SUPPORT.md'
              - 'ARCHITECTURE.md'
              - 'CITATION.cff'
              - 'LICENSE'
              - 'mkdocs.yml'
              - 'assets/**'
              - 'integrations/chatgpt-app/**/*.md'
      - name: Compute docs_only flag
        id: check
        shell: bash
        run: |
          if [[ "${{ steps.filter.outputs.python }}" == 'false' && \
                "${{ steps.filter.outputs.npm }}" == 'false' && \
                "${{ steps.filter.outputs.chatgpt_app }}" == 'false' && \
                "${{ steps.filter.outputs.schemas }}" == 'false' && \
                "${{ steps.filter.outputs.workflows }}" == 'false' && \
                "${{ steps.filter.outputs.dependencies }}" == 'false' && \
                "${{ steps.filter.outputs.docs }}" == 'true' ]]; then
            echo 'docs_only=true' >> "$GITHUB_OUTPUT"
          else
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Summarize detected changes
        run: |
          {
            echo '## Change Detection Summary'
            echo ''
            echo '| Category | Changed |'
            echo '|----------|---------|'
            echo '| python | ${{ steps.filter.outputs.python }} |'
            echo '| npm | ${{ steps.filter.outputs.npm }} |'
            echo '| chatgpt_app | ${{ steps.filter.outputs.chatgpt_app }} |'
            echo '| schemas | ${{ steps.filter.outputs.schemas }} |'
            echo '| workflows | ${{ steps.filter.outputs.workflows }} |'
            echo '| dependencies | ${{ steps.filter.outputs.dependencies }} |'
            echo '| docs | ${{ steps.filter.outputs.docs }} |'
            echo '| **docs_only** | **${{ steps.check.outputs.docs_only }}** |'
          } >> "$GITHUB_STEP_SUMMARY"

  mcp-server:
    needs: [changes]
    if: >-
      always() &&
      (github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - name: Skip heavy CI for docs-only PR
        if: needs.changes.outputs.docs_only == 'true'
        run: |
          echo "::notice::Skipping mcp-server CI — docs-only PR detected"
          echo "skip_ci=true" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: env.skip_ci != 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        if: env.skip_ci != 'true'
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        if: env.skip_ci != 'true'
        with:
          enable-cache: true
          prune-cache: true
          version-file: uv.toml
      - run: corepack enable
        if: env.skip_ci != 'true'
      - run: corepack pnpm install --frozen-lockfile
        if: env.skip_ci != 'true'
      - run: uv sync --all-extras --frozen
        if: env.skip_ci != 'true'
      - run: corepack pnpm run format:check
        if: env.skip_ci != 'true'
      - run: corepack pnpm run lint
        if: env.skip_ci != 'true'
      - run: corepack pnpm run typecheck
        if: env.skip_ci != 'true'
      - run: corepack pnpm run test:unit
        if: env.skip_ci != 'true'
      - run: corepack pnpm run metadata:check
        if: env.skip_ci != 'true'
      - run: corepack pnpm run mcp:manifest:check
        if: env.skip_ci != 'true'
      - run: corepack pnpm run package:check
        if: env.skip_ci != 'true'

  coverage:
    name: CI Tests / Coverage
    needs: [changes]
    if: >-
      always() &&
      (github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Skip full coverage for non-Python PR
        if: >-
          github.event_name == 'pull_request' &&
          needs.changes.outputs.python != 'true' &&
          needs.changes.outputs.workflows != 'true'
        run: |
          echo "::notice::Skipping full Python coverage — no Python or workflow changes detected"
          echo "skip_ci=true" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: env.skip_ci != 'true'
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        if: env.skip_ci != 'true'
        with:
          enable-cache: true
          prune-cache: true
          version-file: uv.toml
      - name: Install Python dependencies
        if: env.skip_ci != 'true'
        run: uv sync --all-extras --frozen
      - name: Run full Python suite with coverage and JUnit
        id: python-tests
        if: env.skip_ci != 'true'
        continue-on-error: true
        run: >-
          uv run python scripts/run_pytest.py full
          --junitxml=python.junit.xml
          -o junit_family=legacy
      - name: Upload Python coverage to Codecov
        if: env.skip_ci != 'true' && !cancelled() && hashFiles('coverage.xml') != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          files: coverage.xml
          disable_search: true
          disable_telem: true
          fail_ci_if_error: false
          flags: python-full
          name: python-full
          verbose: true
      - name: Upload Python test results to Codecov
        if: env.skip_ci != 'true' && !cancelled() && hashFiles('python.junit.xml') != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          report_type: test_results
          files: python.junit.xml
          disable_search: true
          disable_telem: true
          fail_ci_if_error: false
          flags: python-full
          name: python-full-tests
          verbose: true
      - name: Propagate Python test failure
        if: env.skip_ci != 'true' && steps.python-tests.outcome == 'failure'
        run: |
          echo "Full Python suite failed; Codecov uploads were attempted before failing the job."
          exit 1

  mcp-2026-compat:
    name: MCP 2026 Compatibility
    needs: [changes]
    if: >-
      always() &&
      (github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops')
    runs-on: ubuntu-24.04
    steps:
      - name: Skip candidate protocol lane for docs-only PR
        if: needs.changes.outputs.docs_only == 'true'
        run: |
          echo "::notice::Skipping MCP 2026 compatibility — docs-only PR detected"
          echo "skip_ci=true" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: env.skip_ci != 'true'
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        if: env.skip_ci != 'true'
        with:
          enable-cache: true
          prune-cache: true
          version-file: uv.toml
      - run: uv sync --all-extras --frozen
        if: env.skip_ci != 'true'
      - name: Run stable-independent MCP 2026 compatibility contracts
        if: env.skip_ci != 'true'
        run: >-
          uv run pytest tests/unit/test_mcp_2026_config.py
          tests/unit/test_protocol_compat.py
          tests/unit/test_mcp_protocol_2026_contract.py -q

      - name: Run supported-host MCP 2026 smoke cases
        if: env.skip_ci != 'true'
        run: uv run pytest tests/integration/test_mcp_2026_host_smoke.py -q

  mcp-npm:
    needs: [changes]
    if: >-
      always() &&
      (github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    defaults:
      run:
        working-directory: packages/mcp-npm
    steps:
      - name: Skip heavy CI for docs-only PR
        if: needs.changes.outputs.docs_only == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          echo "::notice::Skipping mcp-npm CI — docs-only PR detected"
          echo "skip_ci=true" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: env.skip_ci != 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        if: env.skip_ci != 'true'
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci --ignore-scripts=false
        if: env.skip_ci != 'true'
      - run: npm pack --dry-run
        if: env.skip_ci != 'true'
      - run: npm run build
        if: env.skip_ci != 'true'

  chatgpt-app:
    needs: [changes]
    if: >-
      always() &&
      (github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops')
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: integrations/chatgpt-app/apps-sdk
    steps:
      - name: Skip ChatGPT App CI when unaffected
        if: github.event_name == 'pull_request' && needs.changes.outputs.chatgpt_app != 'true'
        working-directory: ${{ github.workspace }}
        run: |
          echo "::notice::Skipping ChatGPT App CI - no app contract changes detected"
          echo "skip_ci=true" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: env.skip_ci != 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        if: env.skip_ci != 'true'
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci --ignore-scripts=false
        if: env.skip_ci != 'true'
      - run: npm run typecheck
        if: env.skip_ci != 'true'
      - run: npm run build
        if: env.skip_ci != 'true'
      - run: npm run test:smoke
        if: env.skip_ci != 'true'

  protocol-schemas:
    needs: [changes]
    if: >-
      always() &&
      (github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops')
    runs-on: ubuntu-24.04
    steps:
      - name: Skip heavy CI for docs-only PR
        if: needs.changes.outputs.docs_only == 'true'
        run: |
          echo "::notice::Skipping protocol-schemas CI — docs-only PR detected"
          echo "skip_ci=true" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: env.skip_ci != 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        if: env.skip_ci != 'true'
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
        if: env.skip_ci != 'true'
      - run: corepack pnpm install --frozen-lockfile
        if: env.skip_ci != 'true'
      - run: corepack pnpm --filter @oaslananka/kicad-protocol-schemas run format:check
        if: env.skip_ci != 'true'
      - run: corepack pnpm --filter @oaslananka/kicad-protocol-schemas run lint
        if: env.skip_ci != 'true'
      - run: corepack pnpm --filter @oaslananka/kicad-protocol-schemas run typecheck
        if: env.skip_ci != 'true'
      - run: corepack pnpm --filter @oaslananka/kicad-protocol-schemas run test
        if: env.skip_ci != 'true'

  workflow-policy:
    needs: [changes]
    if: >-
      always() &&
      (github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
          prune-cache: true
          version-file: uv.toml
      - run: uv sync --all-extras --frozen
      - run: uv run --all-extras python scripts/check_github_actions_policy.py
      - run: uv run --all-extras python scripts/check_workflows.py --actionlint
      - run: uv run --all-extras python scripts/workflow_security.py --min-severity high

  security:
    needs: [changes]
    if: >-
      always() &&
      (github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Skip Trivy scan for docs-only PR
        if: needs.changes.outputs.docs_only == 'true'
        run: |
          echo "::notice::Skipping Trivy filesystem scan — docs-only PR detected"
          echo "skip_ci=true" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: env.skip_ci != 'true'
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        if: env.skip_ci != 'true'
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          version: v0.70.0

  required-pr-gate:
    name: Required PR Gate
    needs: [changes, mcp-server, coverage, mcp-npm, chatgpt-app, protocol-schemas, mcp-2026-compat, workflow-policy, security]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Evaluate required job results
        shell: bash
        run: |
          set -euo pipefail
          declare -A results=(
            [changes]="${{ needs.changes.result }}"
            [mcp-server]="${{ needs.mcp-server.result }}"
            [coverage]="${{ needs.coverage.result }}"
            [mcp-npm]="${{ needs.mcp-npm.result }}"
            [chatgpt-app]="${{ needs.chatgpt-app.result }}"
            [protocol-schemas]="${{ needs.protocol-schemas.result }}"
            [mcp-2026-compat]="${{ needs.mcp-2026-compat.result }}"
            [workflow-policy]="${{ needs.workflow-policy.result }}"
            [security]="${{ needs.security.result }}"
          )
          docs_only="${{ needs.changes.outputs.docs_only }}"

          {
            echo '## Required PR Gate'
            echo ''
            echo "docs_only: **${docs_only:-n/a}**"
            echo ''
            echo '| Job | Result |'
            echo '|-----|--------|'
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          for job in changes mcp-server coverage mcp-npm chatgpt-app protocol-schemas mcp-2026-compat workflow-policy security; do
            result="${results[$job]}"
            echo "| $job | $result |" >> "$GITHUB_STEP_SUMMARY"
            case "$result" in
              failure|cancelled)
                failed=1
                ;;
            esac
          done

          if [[ "$failed" -eq 1 ]]; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '❌ One or more required jobs failed or was cancelled.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '✅ All required jobs passed or were not applicable to this event.' >> "$GITHUB_STEP_SUMMARY"
