name: Submit locked Python dependencies

on:
  push:
    branches: [main]
    paths:
      - uv.lock
      - pyproject.toml
      - scripts/submit_uv_dependency_snapshot.py
      - .github/workflows/uv-dependency-submission.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit-uv-lock:
    if: github.repository == 'oaslananka/kicad-mcp-pro' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Required only to submit accurate dependency-graph snapshots
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Convert locked dependencies into a reproducible graph
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/submit_uv_dependency_snapshot.py \
            --sha "$GITHUB_SHA" \
            --ref "$GITHUB_REF" \
            --job-id "$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/uv-dependency-snapshot.json"

      - name: Submit to GitHub dependency graph
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" \
            --input "$RUNNER_TEMP/uv-dependency-snapshot.json" \
            --jq '.result'
