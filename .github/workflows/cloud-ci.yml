name: Cloud CI

on:
  push:
    branches: [main]
    paths:
      - "apps/cloud/**"
      - ".github/workflows/cloud-ci.yml"
  pull_request:
    paths:
      - "apps/cloud/**"
      - ".github/workflows/cloud-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# Keep exact-main evidence; only superseded pull-request checks are cancelled.
concurrency:
  group: cloud-ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  cloud:
    runs-on: ubuntu-24.04
    # Disposable PostgreSQL fixture runs all DB/connector integration tests.
    # The credentials below are isolated CI-only values, never production data.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kicad_test
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: kicad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kicad_test -d kicad_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: ${{ format('postgresql://kicad_test:{0}@127.0.0.1:5432/kicad_test', github.run_id) }}
    defaults:
      run:
        working-directory: apps/cloud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/cloud/package-lock.json
      - name: Install Cloud dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate Cloud types, build and tests
        run: npm run check
      # The production image has a stricter build context than npm in CI.
      # Fail before deployment if a required build helper is excluded.
      - name: Build Cloud production container (no publish)
        run: docker build --file Dockerfile --tag "kicad-cloud-ci:$GITHUB_SHA" --build-arg "APP_REVISION=$GITHUB_SHA" .
      - name: Validate Cloudflare edge contracts
        run: node --test scripts/test-cloudflare-edge.mjs
