name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops'
    runs-on: ubuntu-24.04
    steps:
      # Use a short-lived GitHub App installation token so release PR creation and the
      # release-artifact sync push trigger the normal CI graph without a long-lived maintainer PAT.
      - name: Mint release automation token
        id: release-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.OASLANANKA_OPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.OASLANANKA_OPS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.release-app-token.outputs.token }}

      # release-please bumps package versions, while several tracked generated artifacts
      # derive values from the bumped pyproject and cannot be maintained safely by its
      # field updaters alone. Regenerate every canonical release-derived artifact through
      # one entry point, then push any drift onto the release PR branch before CI evaluates it.
      - name: Detect release PR branch
        id: release-pr-branch
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          REPOSITORY_NAME: ${{ github.repository }}
        run: |
          branch="$(gh pr list --repo "${REPOSITORY_NAME}" --state open --head release-please--branches--main --json headRefName --jq '.[0].headRefName // ""')"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      - if: ${{ steps.release-pr-branch.outputs.branch != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.release-pr-branch.outputs.branch }}
          token: ${{ steps.release-app-token.outputs.token }}
          persist-credentials: false
      - if: ${{ steps.release-pr-branch.outputs.branch != '' }}
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: false
      - if: ${{ steps.release-pr-branch.outputs.branch != '' }}
        name: Sync canonical release artifacts onto the release PR
        env:
          RELEASE_PR_BRANCH: ${{ steps.release-pr-branch.outputs.branch }}
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
        run: |
          uv run --all-extras python scripts/sync_release_artifacts.py --write
          if [ -n "$(git status --porcelain)" ]; then
            app_slug="${{ steps.release-app-token.outputs.app-slug }}"
            app_user_id="$(gh api "/users/${app_slug}[bot]" --jq .id)"
            git config user.name "${app_slug}[bot]"
            git config user.email "${app_user_id}+${app_slug}[bot]@users.noreply.github.com"
            git commit -am "chore: sync canonical release artifacts"
            gh auth setup-git
            git push origin "HEAD:${RELEASE_PR_BRANCH}"
          fi
