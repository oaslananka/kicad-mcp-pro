name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
    if: github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops'
    runs-on: ubuntu-24.04
    steps:
      # A PAT (RELEASE_PLEASE_TOKEN) is used so that the release PR and the follow-up
      # metadata-sync commit trigger CI -- commits/PRs created with the default
      # GITHUB_TOKEN do not start new workflow runs. Falls back to GITHUB_TOKEN when the
      # PAT is not configured (the release PR is still created, but its checks must be
      # re-triggered manually).
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      # release-please bumps the bare version fields, but server.json / mcp.json embed
      # the version inside the OCI image identifier (ghcr.io/...:X.Y.Z), which its JSON
      # updater cannot bump (it replaces whole values, not substrings). Regenerate the
      # version-derived metadata from the bumped pyproject and push it onto the release
      # PR branch so the metadata-sync gate passes.
      - name: Detect release PR branch
        id: release-pr-branch
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          REPOSITORY_NAME: ${{ github.repository }}
        run: |
          branch="$(gh pr list --repo "${REPOSITORY_NAME}" --state open --head release-please--branches--main --json headRefName --jq '.[0].headRefName // ""')"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      - if: ${{ steps.release-pr-branch.outputs.branch != '' }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ steps.release-pr-branch.outputs.branch }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: false
      - if: ${{ steps.release-pr-branch.outputs.branch != '' }}
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: false
      - if: ${{ steps.release-pr-branch.outputs.branch != '' }}
        name: Sync version-derived MCP metadata onto the release PR
        env:
          RELEASE_PR_BRANCH: ${{ steps.release-pr-branch.outputs.branch }}
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          uv run --all-extras python scripts/sync_mcp_metadata.py --write
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: sync version-derived MCP metadata"
            gh auth setup-git
            git push origin "HEAD:${RELEASE_PR_BRANCH}"
          fi
