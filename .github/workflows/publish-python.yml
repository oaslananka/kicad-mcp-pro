name: Publish Python

on:
  workflow_dispatch:
  push:
    tags:
      - "mcp-server-v*"

permissions:
  contents: read

concurrency:
  group: publish-python-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops') &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/mcp-server-v')))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: false
          version-file: uv.toml
      - run: uv sync --all-extras --frozen
      - run: uv build
      - run: uv run --all-extras python scripts/check_package_metadata.py
      - name: Verify release tag matches package version
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(uv run --frozen python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          test "$RELEASE_TAG" = "mcp-server-v${version}"
      - name: Generate Python release evidence
        shell: bash
        run: |
          set -euo pipefail
          uv run --all-extras python scripts/generate_release_evidence.py generate \
            --dist-dir dist \
            --output release-evidence
          uv run --all-extras python scripts/generate_release_evidence.py verify-local \
            --checksums release-evidence/SHA256SUMS.txt \
            --artifacts dist
          (cd dist && sha256sum --check ../release-evidence/SHA256SUMS.txt)
      - name: Attest Python distributions
        id: attest-python
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-checksums: release-evidence/SHA256SUMS.txt
          sbom-path: release-evidence/sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-release-evidence
          path: release-evidence
          retention-days: 14
      - name: Attach Python evidence to GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          upload_dir="release-assets/upload/kicad-mcp-pro-python"
          mkdir -p "$upload_dir"
          cp dist/*.whl "$upload_dir/"
          cp dist/*.tar.gz "$upload_dir/"
          cp release-evidence/SHA256SUMS.txt "$upload_dir/kicad-mcp-pro-python-SHA256SUMS.txt"
          cp release-evidence/sbom.cdx.json "$upload_dir/kicad-mcp-pro-python-sbom.cdx.json"
          cp release-evidence/release-evidence.json "$upload_dir/kicad-mcp-pro-python-release-evidence.json"
          for attempt in $(seq 1 18); do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              gh release upload "$RELEASE_TAG" \
                "$upload_dir"/* \
                --clobber
              exit 0
            fi
            if [ "$attempt" -lt 18 ]; then sleep 10; fi
          done
          echo "GitHub Release $RELEASE_TAG was not available for evidence upload." >&2
          exit 1

  publish-testpypi:
    if: (github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops') && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/kicad-mcp-pro
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: false
          version-file: uv.toml
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: python-dist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: python-release-evidence
          path: release-evidence
      - name: Verify Python checksums before TestPyPI publish
        run: |
          uv run --frozen python scripts/generate_release_evidence.py verify-local --checksums release-evidence/SHA256SUMS.txt --artifacts dist
          (cd dist && sha256sum --check ../release-evidence/SHA256SUMS.txt)
      - name: Check if version already published
        id: check-published
        shell: bash
        run: |
          set -euo pipefail
          version="$(uv run --frozen python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          if curl -fsS "https://test.pypi.org/pypi/kicad-mcp-pro/${version}/json" >/dev/null; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        if: steps.check-published.outputs.already_published != 'true'
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/
          attestations: true
      - name: Verify TestPyPI published digests
        run: |
          version="$(uv run --frozen python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          uv run --frozen python scripts/generate_release_evidence.py verify-pypi \
            --repository testpypi \
            --package kicad-mcp-pro \
            --version "$version" \
            --checksums release-evidence/SHA256SUMS.txt
          uv run --frozen --group release python scripts/generate_release_evidence.py verify-pypi-provenance \
            --repository testpypi \
            --package kicad-mcp-pro \
            --version "$version" \
            --checksums release-evidence/SHA256SUMS.txt \
            --publisher-repository oaslananka/kicad-mcp-pro \
            --publisher-workflow publish-python.yml \
            --publisher-environment testpypi \
            --artifacts dist

  publish-pypi:
    if: >-
      (github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops') &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/mcp-server-v')
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/kicad-mcp-pro
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: false
          version-file: uv.toml
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: python-dist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: python-release-evidence
          path: release-evidence
      - name: Verify Python checksums before PyPI publish
        run: |
          uv run --frozen python scripts/generate_release_evidence.py verify-local --checksums release-evidence/SHA256SUMS.txt --artifacts dist
          (cd dist && sha256sum --check ../release-evidence/SHA256SUMS.txt)
      - name: Check if version already published
        id: check-published
        shell: bash
        run: |
          set -euo pipefail
          version="$(uv run --frozen python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          if curl -fsS "https://pypi.org/pypi/kicad-mcp-pro/${version}/json" >/dev/null; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        if: steps.check-published.outputs.already_published != 'true'
        with:
          packages-dir: dist
          attestations: true
      - name: Verify PyPI published digests
        run: |
          version="$(uv run --frozen python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          uv run --frozen python scripts/generate_release_evidence.py verify-pypi \
            --repository pypi \
            --package kicad-mcp-pro \
            --version "$version" \
            --checksums release-evidence/SHA256SUMS.txt
          uv run --frozen --group release python scripts/generate_release_evidence.py verify-pypi-provenance \
            --repository pypi \
            --package kicad-mcp-pro \
            --version "$version" \
            --checksums release-evidence/SHA256SUMS.txt \
            --publisher-repository oaslananka/kicad-mcp-pro \
            --publisher-workflow publish-python.yml \
            --publisher-environment pypi \
            --artifacts dist
