name: Publish Python

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-python-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops') &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'release' && github.event.release.draft == false &&
        startsWith(github.event.release.tag_name, 'mcp-server-v')))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Creating a protected tag alone is not permission to publish to PyPI.
      - name: Verify published release source
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'oaslananka/kicad-mcp-pro' || "$GITHUB_REPOSITORY" == 'oaslananka-ops/kicad-mcp-pro' ]] || exit 1
          [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$RELEASE_TAG" =~ ^mcp-server-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$EXPECTED_REF" == "refs/tags/$RELEASE_TAG" ]] || exit 1
          tag_sha="$(git rev-list -n1 "refs/tags/$RELEASE_TAG^{commit}")"
          head_sha="$(git rev-parse HEAD)"
          [[ "$tag_sha" == "$EXPECTED_SHA" && "$head_sha" == "$EXPECTED_SHA" ]] || exit 1
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          [[ "$RELEASE_TAG" == "mcp-server-v$version" ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" | jq -e \
            --argjson id "$RELEASE_ID" --arg tag "$RELEASE_TAG" \
            '.id == $id and .tag_name == $tag and .draft == false and
             (.published_at | type == "string" and length > 0)' >/dev/null
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: false
          version-file: uv.toml
      - run: uv sync --all-extras --frozen
      - name: Enforce live-model release readiness
        if: github.event_name == 'release'
        run: uv run --all-extras python scripts/check_live_model_release_policy.py --require-ready release --ref HEAD
      - run: uv build
      - run: uv run --all-extras python scripts/check_package_metadata.py
      - name: Generate Python release evidence
        shell: bash
        run: |
          set -euo pipefail
          uv run --all-extras python scripts/generate_release_evidence.py generate \
            --dist-dir dist \
            --output release-evidence
          uv run --all-extras python scripts/generate_release_evidence.py verify-local \
            --checksums release-evidence/SHA256SUMS.txt \
            --artifacts dist
          (cd dist && sha256sum --check ../release-evidence/SHA256SUMS.txt)
      # Subject checksums bind both wheel and sdist to their exact built bytes.
      # Passing sbom-path produces CycloneDX predicate, not SLSA provenance;
      # keep that attestation and add a separate default-provenance attestation.
      - name: Attest Python SLSA build provenance
        id: attest-python-slsa
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-checksums: release-evidence/SHA256SUMS.txt
      - name: Attest Python distributions
        id: attest-python
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-checksums: release-evidence/SHA256SUMS.txt
          sbom-path: release-evidence/sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: python-release-evidence
          path: release-evidence
          retention-days: 14
      # Recovery may build from an older tag. Run the safety helper from the
      # exact workflow revision, not the historical package checkout.
      - name: Load reviewed release attachment helper
        if: github.event_name == 'release'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          sparse-checkout: scripts
          persist-credentials: false

      - name: Attach Python evidence to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/.release-tools
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          upload_dir="release-assets/upload/kicad-mcp-pro-python"
          mkdir -p "$upload_dir"
          cp dist/*.whl "$upload_dir/"
          cp dist/*.tar.gz "$upload_dir/"
          cp release-evidence/SHA256SUMS.txt "$upload_dir/kicad-mcp-pro-python-SHA256SUMS.txt"
          cp release-evidence/sbom.cdx.json "$upload_dir/kicad-mcp-pro-python-sbom.cdx.json"
          cp release-evidence/release-evidence.json "$upload_dir/kicad-mcp-pro-python-release-evidence.json"
          python3 -P -m scripts.attach_published_release_assets \
            --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" \
            --source-commit "$(git rev-parse HEAD)" --source-root "$GITHUB_WORKSPACE" \
            --execute "$upload_dir"/*

  publish-testpypi:
    if: (github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops') && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/kicad-mcp-pro
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: false
          version-file: uv.toml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: python-dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: python-release-evidence
          path: release-evidence
      - name: Verify Python checksums before TestPyPI publish
        run: |
          uv run --frozen python scripts/generate_release_evidence.py verify-local --checksums release-evidence/SHA256SUMS.txt --artifacts dist
          (cd dist && sha256sum --check ../release-evidence/SHA256SUMS.txt)
      - name: Stage missing verified Python distributions
        id: stage-upload
        shell: bash
        run: |
          set -euo pipefail
          version="$(uv run --frozen python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          missing_count="$(uv run --frozen --group release python scripts/generate_release_evidence.py stage-pypi-upload \
            --repository testpypi --version "$version" \
            --checksums release-evidence/SHA256SUMS.txt --artifacts dist --output pending-dist)"
          [[ "$missing_count" =~ ^[012]$ ]] || exit 1
          echo "missing_count=$missing_count" >> "$GITHUB_OUTPUT"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        if: steps.stage-upload.outputs.missing_count == '1' || steps.stage-upload.outputs.missing_count == '2'
        with:
          packages-dir: pending-dist
          repository-url: https://test.pypi.org/legacy/
          attestations: true
      - name: Verify TestPyPI published digests
        run: |
          version="$(uv run --frozen python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          uv run --frozen python scripts/generate_release_evidence.py verify-pypi \
            --repository testpypi \
            --package kicad-mcp-pro \
            --version "$version" \
            --checksums release-evidence/SHA256SUMS.txt
          uv run --frozen --group release python scripts/generate_release_evidence.py verify-pypi-provenance \
            --repository testpypi \
            --package kicad-mcp-pro \
            --version "$version" \
            --checksums release-evidence/SHA256SUMS.txt \
            --publisher-repository oaslananka/kicad-mcp-pro \
            --publisher-workflow publish-python.yml \
            --publisher-environment testpypi \
            --artifacts dist

  publish-pypi:
    if: >-
      (github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops') &&
      github.event_name == 'release' && github.event.release.draft == false &&
      startsWith(github.event.release.tag_name, 'mcp-server-v')
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/kicad-mcp-pro
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: false
          version-file: uv.toml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: python-dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: python-release-evidence
          path: release-evidence
      - name: Verify Python checksums before PyPI publish
        run: |
          uv run --frozen python scripts/generate_release_evidence.py verify-local --checksums release-evidence/SHA256SUMS.txt --artifacts dist
          (cd dist && sha256sum --check ../release-evidence/SHA256SUMS.txt)
      - name: Stage missing verified Python distributions
        id: stage-upload
        shell: bash
        run: |
          set -euo pipefail
          version="$(uv run --frozen python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          missing_count="$(uv run --frozen --group release python scripts/generate_release_evidence.py stage-pypi-upload \
            --repository pypi --version "$version" \
            --checksums release-evidence/SHA256SUMS.txt --artifacts dist --output pending-dist)"
          [[ "$missing_count" =~ ^[012]$ ]] || exit 1
          echo "missing_count=$missing_count" >> "$GITHUB_OUTPUT"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        if: steps.stage-upload.outputs.missing_count == '1' || steps.stage-upload.outputs.missing_count == '2'
        with:
          packages-dir: pending-dist
          attestations: true
      - name: Verify PyPI published digests
        run: |
          version="$(uv run --frozen python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          uv run --frozen python scripts/generate_release_evidence.py verify-pypi \
            --repository pypi \
            --package kicad-mcp-pro \
            --version "$version" \
            --checksums release-evidence/SHA256SUMS.txt
          uv run --frozen --group release python scripts/generate_release_evidence.py verify-pypi-provenance \
            --repository pypi \
            --package kicad-mcp-pro \
            --version "$version" \
            --checksums release-evidence/SHA256SUMS.txt \
            --publisher-repository oaslananka/kicad-mcp-pro \
            --publisher-workflow publish-python.yml \
            --publisher-environment pypi \
            --artifacts dist
