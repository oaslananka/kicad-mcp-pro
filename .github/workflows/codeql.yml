name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'scripts/**'
              - 'packages/**'
              - 'fuzz/**'
              - 'evals/**'
              - 'performance/**'
              - '*.py'
              - '*.js'
              - '*.ts'
              - '*.mjs'
              - '*.cjs'
      - name: Compute docs_only flag
        id: check
        shell: bash
        run: |
          if [[ "${{ steps.filter.outputs.code }}" == 'false' ]]; then
            echo 'docs_only=true' >> "$GITHUB_OUTPUT"
          else
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
          fi

  analyze:
    needs: [changes]
    if: >-
      always() &&
      (github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops')
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Skip CodeQL for docs-only PR
        if: needs.changes.outputs.docs_only == 'true'
        run: |
          echo "::notice::Skipping CodeQL analysis — docs-only PR detected (no code changes)"
          echo "skip_ci=true" >> "$GITHUB_ENV"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        if: env.skip_ci != 'true'
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3
        if: env.skip_ci != 'true'
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@87557b9c84dde89fdd9b10e88954ac2f4248e463
        if: env.skip_ci != 'true'
