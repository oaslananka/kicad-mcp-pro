name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analysis:
    if: github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops'
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: read
      pull-requests: read
      statuses: read
      security-events: write
      id-token: write
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          repo_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          sarif_file: results.sarif
