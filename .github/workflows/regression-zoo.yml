name: Regression Zoo

on:
  schedule:
    - cron: "21 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-zoo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    if: github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: true
          prune-cache: true
          version-file: uv.toml
      - name: Setup pinned pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.28.6
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-extras --frozen
      - run: pnpm run test:benchmark
