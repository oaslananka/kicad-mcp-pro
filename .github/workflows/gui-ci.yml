name: GUI CI

on:
  push:
    branches: [main, "feat/gui-*"]
    paths:
      - "src/kicad_mcp/web/**"
      - "src/kicad_mcp/tray.py"
      - "src-tauri/**"
      - "tests/unit/test_web_routes*.py"
      - "tests/unit/test_tray.py"
      - "tests/unit/test_cli_init.py"
      - "tests/e2e/test_web_dashboard.py"
      - ".github/workflows/gui-ci.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "rust-toolchain.toml"
      - "scripts/check_rustsec_audit.py"
      - ".github/security/rustsec-baseline.json"
  pull_request:
    branches: [main]
    paths:
      - "src/kicad_mcp/web/**"
      - "src/kicad_mcp/tray.py"
      - "src-tauri/**"
      - "tests/unit/test_web_routes*.py"
      - "tests/unit/test_tray.py"
      - "tests/unit/test_cli_init.py"
      - "tests/e2e/test_web_dashboard.py"
      - ".github/workflows/gui-ci.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "rust-toolchain.toml"
      - "scripts/check_rustsec_audit.py"
      - ".github/security/rustsec-baseline.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gui-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    if: github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
          prune-cache: true
          version-file: uv.toml
      - name: Install Python dependencies
        run: uv sync --all-extras --frozen
      - name: Run dashboard and tray unit tests
        run: uv run pytest tests/unit/test_web_routes.py tests/unit/test_web_routes_step3.py tests/unit/test_tray.py tests/unit/test_cli_init.py -v
      - name: Lint dashboard and tray modules
        run: uv run ruff check src/kicad_mcp/web src/kicad_mcp/tray.py src/kicad_mcp/cli_init.py

  playwright:
    if: github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
          prune-cache: true
          version-file: uv.toml
      - name: Install test dependencies
        run: uv sync --group dev --frozen
      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium
      - name: Run dashboard E2E tests
        run: E2E=1 uv run pytest tests/e2e/test_web_dashboard.py -v

  rustsec-audit:
    if: github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Verify reviewed RustSec dependency baseline
        working-directory: src-tauri
        shell: bash
        run: |
          set -euo pipefail
          audit_status=0
          cargo audit --json --no-yanked > ../rustsec-audit.json || audit_status=$?
          if [ "$audit_status" -gt 1 ]; then
            echo "cargo-audit failed before producing valid audit evidence (exit=$audit_status)" >&2
            exit "$audit_status"
          fi
          audit_version="$(cargo audit --version | awk '{print $2}')"
          python3 ../scripts/check_rustsec_audit.py \
            --report ../rustsec-audit.json \
            --baseline ../.github/security/rustsec-baseline.json \
            --cargo-audit-version "$audit_version"

  tauri-check:
    if: github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Cargo check Tauri bridge
        working-directory: src-tauri
        run: cargo check --locked
      - name: Test Tauri backend compatibility contract
        working-directory: src-tauri
        run: cargo test --locked --lib
