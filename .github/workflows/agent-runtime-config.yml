name: Agent Runtime Config

on:
  pull_request:
    paths:
      - ".claude-plugin/plugin.json"
      - ".mcp.json"
      - "plugin.json"
      - "mcp.json"
      - "scripts/sync_agent_skills.py"
      - "scripts/sync_mcp_metadata.py"
      - "src/kicad_mcp/data/agent_skills/**"
      - "tests/unit/test_agent_runtime_workflow.py"
      - ".vscode/mcp.example.json"
      - ".codex/config.example.toml"
      - "opencode.example.jsonc"
      - "integrations/opencode/opencode.example.json"
      - ".agents/skills/**/SKILL.md"
      - "skills/**/SKILL.md"
      - ".opencode/skills/**/SKILL.md"
      - "docs/agent-runtime-config.md"
      - ".github/workflows/agent-runtime-config.yml"
  push:
    branches: [main]
    paths:
      - ".claude-plugin/plugin.json"
      - ".mcp.json"
      - "plugin.json"
      - "mcp.json"
      - "scripts/sync_agent_skills.py"
      - "scripts/sync_mcp_metadata.py"
      - "src/kicad_mcp/data/agent_skills/**"
      - "tests/unit/test_agent_runtime_workflow.py"
      - ".vscode/mcp.example.json"
      - ".codex/config.example.toml"
      - "opencode.example.jsonc"
      - "integrations/opencode/opencode.example.json"
      - ".agents/skills/**/SKILL.md"
      - "skills/**/SKILL.md"
      - ".opencode/skills/**/SKILL.md"
      - "docs/agent-runtime-config.md"
      - ".github/workflows/agent-runtime-config.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate JSON files
        run: |
          python3 -m json.tool .claude-plugin/plugin.json >/dev/null
          python3 -m json.tool .mcp.json >/dev/null
          python3 -m json.tool plugin.json >/dev/null
          python3 -m json.tool mcp.json >/dev/null
          python3 -m json.tool .vscode/mcp.example.json >/dev/null
      - name: Validate agent runtime references
        run: |
          python3 - <<'PY'
          import json, tomllib
          from pathlib import Path

          plugin = json.loads(Path('.claude-plugin/plugin.json').read_text(encoding='utf-8'))
          assert plugin.get('$schema') == 'https://anthropic.com/claude-code/plugin.schema.json'
          assert plugin.get('mcpServers') == './.mcp.json'
          claude_mcp = json.loads(Path('.mcp.json').read_text(encoding='utf-8'))
          claude_server = claude_mcp['mcpServers']['kicad-mcp-pro']
          assert claude_server['command'] == 'uvx'
          assert claude_server['args'] == ['kicad-mcp-pro', '--transport', 'stdio']
          assert claude_server['env']['KICAD_MCP_OPERATING_MODE'] == 'readonly'
          assert claude_server['env']['KICAD_MCP_PROFILE'] == 'default'
          assert claude_server['env']['KICAD_MCP_TRANSPORT'] == 'stdio'
          version = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          portable = json.loads(Path('plugin.json').read_text(encoding='utf-8'))
          assert portable['name'] == plugin['name'] == 'kicad-pro'
          assert portable['version'] == plugin['version'] == version
          portable_mcp = json.loads(Path('mcp.json').read_text(encoding='utf-8'))
          portable_server = portable_mcp['mcpServers']['kicad']
          assert portable_server['type'] == 'stdio'
          assert portable_server['command'] == 'uvx'
          assert portable_server['args'] == ['--from', f'kicad-mcp-pro=={version}', 'kicad-mcp-pro', '--transport', 'stdio']
          assert portable_server['env'] == claude_server['env']
          skills = plugin.get('skills')
          assert isinstance(skills, list) and len(skills) == 7
          for entry in skills:
              assert entry.startswith('./skills/')
              canonical = Path(entry[2:]) / 'SKILL.md'
              assert canonical.is_file(), canonical
              text = canonical.read_text(encoding='utf-8')
              assert text.startswith('---\n'), canonical
              assert f'name: {Path(entry).name}' in text, canonical
              for root in (Path('.opencode/skills'), Path('.agents/skills'), Path('integrations/gemini-cli/kicad-mcp-pro/skills'), Path('src/kicad_mcp/data/agent_skills')):
                  mirror = root / Path(entry).name / 'SKILL.md'
                  assert mirror.is_file(), mirror
                  assert mirror.read_text(encoding='utf-8') == text, mirror

          codex = tomllib.loads(Path('.codex/config.example.toml').read_text(encoding='utf-8'))
          assert isinstance(codex.get('mcp_servers'), dict)
          server = codex['mcp_servers']['kicad']
          assert server['command'] == 'uvx'
          assert server['env']['KICAD_MCP_OPERATING_MODE'] == 'readonly'
          assert 'default_tools_approval_mode' not in server
          opencode = json.loads(Path('integrations/opencode/opencode.example.json').read_text(encoding='utf-8'))
          assert isinstance(opencode.get('mcp'), dict) and opencode['mcp']
          print('agent runtime configuration and skills are consistent')
          PY
