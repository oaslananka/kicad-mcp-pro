name: Draft producer preflight (non-publishing)

on:
  workflow_dispatch:
    inputs:
      server_tag:
        description: Existing protected mcp-server-vX.Y.Z tag on this exact main SHA.
        required: true
        type: string
      schemas_tag:
        description: Existing protected protocol-schemas-vX.Y.Z tag on this same main SHA.
        required: true
        type: string
      source_commit:
        description: Exact approved main SHA, equal to both tags.
        required: true
        type: string
      npm_tag:
        description: Existing protected mcp-npm-vX.Y.Z tag, required if include_npm.
        required: false
        type: string
      gui_tag:
        description: Existing protected kicad-mcp-gui-vX.Y.Z tag, required if include_gui.
        required: false
        type: string
      include_npm:
        description: Also prepare the npm launcher (no publication).
        required: false
        type: boolean
        default: false
      include_gui:
        description: Also build three platform GUI installers (costly; no publication).
        required: false
        type: boolean
        default: false
      include_container:
        description: Also prepare the container (costly; no publication).
        required: false
        type: boolean
        default: false
      include_registry:
        description: Also prepare MCP Registry evidence (no publication).
        required: false
        type: boolean
        default: false

# Preflight concurrency is NOT a verified exclusive Release writer lock.
concurrency:
  group: draft-producer-preflight-${{ inputs.source_commit }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  source:
    if: >-
      github.repository == 'oaslananka/kicad-mcp-pro' &&
      github.ref == 'refs/heads/main' &&
      inputs.source_commit != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify protected main and exact tag source identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.source_commit }}
          SERVER_TAG: ${{ inputs.server_tag }}
          SCHEMAS_TAG: ${{ inputs.schemas_tag }}
          NPM_TAG: ${{ inputs.npm_tag }}
          GUI_TAG: ${{ inputs.gui_tag }}
          INCLUDE_NPM: ${{ inputs.include_npm }}
          INCLUDE_GUI: ${{ inputs.include_gui }}
          INCLUDE_CONTAINER: ${{ inputs.include_container }}
          INCLUDE_REGISTRY: ${{ inputs.include_registry }}
          CALLER_REF: ${{ github.ref }}
          CALLER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$CALLER_REF" == "refs/heads/main" ]] || exit 1
          [[ "$CALLER_SHA" == "$EXPECTED_SHA" ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]] || exit 1
          [[ "$SERVER_TAG" =~ ^mcp-server-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$SCHEMAS_TAG" =~ ^protocol-schemas-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          server_sha="$(git rev-list -n 1 "refs/tags/$SERVER_TAG^{commit}")" || exit 1
          schemas_sha="$(git rev-list -n 1 "refs/tags/$SCHEMAS_TAG^{commit}")" || exit 1
          [[ "$server_sha" == "$EXPECTED_SHA" ]] || exit 1
          [[ "$schemas_sha" == "$EXPECTED_SHA" ]] || exit 1
          server_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" || exit 1
          schemas_version="$(python3 -c 'import json; print(json.load(open("packages/protocol-schemas/package.json"))["version"])')" || exit 1
          [[ "$SERVER_TAG" == "mcp-server-v$server_version" ]] || exit 1
          [[ "$SCHEMAS_TAG" == "protocol-schemas-v$schemas_version" ]] || exit 1

          # Optional high-cost producer families remain disabled unless the
          # operator explicitly opts in. All tag/source/version checks complete
          # in this one read-only job before any reusable build can run.
          for include in "$INCLUDE_NPM" "$INCLUDE_GUI" "$INCLUDE_CONTAINER" "$INCLUDE_REGISTRY"; do
            [[ "$include" == "true" || "$include" == "false" ]] || exit 1
          done
          if [[ "$INCLUDE_NPM" == "true" ]]; then
            [[ "$NPM_TAG" =~ ^mcp-npm-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            npm_sha="$(git rev-list -n 1 "refs/tags/$NPM_TAG^{commit}")" || exit 1
            [[ "$npm_sha" == "$EXPECTED_SHA" ]] || exit 1
            npm_version="$(python3 -c 'import json; print(json.load(open("packages/mcp-npm/package.json"))["version"])')" || exit 1
            [[ "$NPM_TAG" == "mcp-npm-v$npm_version" ]] || exit 1
          else
            [[ -z "$NPM_TAG" ]] || exit 1
          fi
          if [[ "$INCLUDE_GUI" == "true" ]]; then
            [[ "$GUI_TAG" =~ ^kicad-mcp-gui-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            gui_sha="$(git rev-list -n 1 "refs/tags/$GUI_TAG^{commit}")" || exit 1
            [[ "$gui_sha" == "$EXPECTED_SHA" ]] || exit 1
            gui_version="$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')" || exit 1
            cargo_version="$(python3 -c 'import tomllib; print(tomllib.load(open("src-tauri/Cargo.toml", "rb"))["package"]["version"])')" || exit 1
            [[ "$GUI_TAG" == "kicad-mcp-gui-v$gui_version" ]] || exit 1
            [[ "$cargo_version" == "$gui_version" ]] || exit 1
          else
            [[ -z "$GUI_TAG" ]] || exit 1
          fi

  python:
    needs: source
    uses: ./.github/workflows/prepare-python.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    with:
      tag: ${{ inputs.server_tag }}
      source_commit: ${{ inputs.source_commit }}

  mcpb:
    needs: source
    uses: ./.github/workflows/prepare-mcpb.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    with:
      tag: ${{ inputs.server_tag }}
      source_commit: ${{ inputs.source_commit }}

  pcm:
    needs: source
    uses: ./.github/workflows/prepare-kicad-pcm.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    with:
      tag: ${{ inputs.server_tag }}
      source_commit: ${{ inputs.source_commit }}

  schemas:
    needs: source
    uses: ./.github/workflows/prepare-protocol-schemas.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    with:
      tag: ${{ inputs.schemas_tag }}
      source_commit: ${{ inputs.source_commit }}


  # Additional non-publishing preparers share the same exact main-source gate.
  # All are opt-in to avoid unneeded native GUI/container compute and artifact retention.
  npm:
    needs: source
    if: inputs.include_npm == true
    uses: ./.github/workflows/prepare-npm.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    with:
      tag: ${{ inputs.npm_tag }}
      source_commit: ${{ inputs.source_commit }}

  gui:
    needs: source
    if: inputs.include_gui == true
    uses: ./.github/workflows/prepare-gui.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    with:
      tag: ${{ inputs.gui_tag }}
      source_commit: ${{ inputs.source_commit }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  container:
    needs: source
    if: inputs.include_container == true
    uses: ./.github/workflows/prepare-mcp-container.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    with:
      tag: ${{ inputs.server_tag }}
      source_commit: ${{ inputs.source_commit }}

  registry:
    needs: source
    if: inputs.include_registry == true
    uses: ./.github/workflows/prepare-mcp-registry.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    with:
      tag: ${{ inputs.server_tag }}
      source_commit: ${{ inputs.source_commit }}
