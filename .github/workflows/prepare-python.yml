name: Prepare Python (non-publishing)

on:
  workflow_call:
    inputs:
      tag:
        description: Exact protected mcp-server tag for the distributions to prepare.
        required: true
        type: string
      source_commit:
        description: Exact reviewed main SHA resolved by the protected tag.
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.repository == 'oaslananka/kicad-mcp-pro' &&
      github.ref == 'refs/heads/main' &&
      inputs.source_commit != '' &&
      startsWith(inputs.tag, 'mcp-server-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reusable preparation source identity
        shell: bash
        env:
          EXPECTED_TAG: ${{ inputs.tag }}
          EXPECTED_SOURCE: ${{ inputs.source_commit }}
          CALLER_SHA: ${{ github.sha }}
          CALLER_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # Explicit rejection is independent of Bash's errexit semantics.
          [[ "$EXPECTED_TAG" =~ ^mcp-server-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$CALLER_REF" == "refs/heads/main" ]] || exit 1
          [[ "$CALLER_SHA" == "$EXPECTED_SOURCE" ]] || exit 1
          checked_out="$(git rev-parse HEAD)" || exit 1
          [[ "$checked_out" == "$EXPECTED_SOURCE" ]] || exit 1
          tagged_source="$(git rev-list -n 1 "refs/tags/$EXPECTED_TAG")" || exit 1
          [[ "$tagged_source" == "$EXPECTED_SOURCE" ]] || exit 1
          expected_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" || exit 1
          [[ "$EXPECTED_TAG" == "mcp-server-v$expected_version" ]] || exit 1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: false
          version-file: uv.toml
      - run: uv sync --all-extras --frozen
      - run: uv build
      - run: uv run --all-extras python scripts/check_package_metadata.py
      - name: Generate Python release evidence
        shell: bash
        run: |
          set -euo pipefail
          uv run --all-extras python scripts/generate_release_evidence.py generate \
            --dist-dir dist \
            --output release-evidence
          uv run --all-extras python scripts/generate_release_evidence.py verify-local \
            --checksums release-evidence/SHA256SUMS.txt \
            --artifacts dist
          (cd dist && sha256sum --check ../release-evidence/SHA256SUMS.txt)
      # Subject checksums bind both wheel and sdist to their exact built bytes.
      # Passing sbom-path produces CycloneDX predicate, not SLSA provenance;
      # keep that attestation and add a separate default-provenance attestation.
      - name: Attest Python SLSA build provenance
        id: attest-python-slsa
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-checksums: release-evidence/SHA256SUMS.txt
      - name: Attest Python distributions
        id: attest-python
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-checksums: release-evidence/SHA256SUMS.txt
          sbom-path: release-evidence/sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: python-release-evidence
          path: release-evidence
          retention-days: 14
