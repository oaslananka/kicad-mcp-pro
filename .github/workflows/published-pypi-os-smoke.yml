name: Published PyPI OS Smoke

# Manual acceptance of the already-published Python package on fresh OS runners.
# Select a ref containing this workflow and the already-published package version.
# Do not make this an always-on PR gate or run a KiCad GUI installer here.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-os-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-published-install:
    name: Published PyPI clean MCP (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    steps:
      - name: Checkout version manifest and public test fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pinned uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version-file: uv.toml
          enable-cache: false

      - name: Clean PyPI install and real MCP read-only diagnostic
        shell: bash
        env:
          UV_NO_CACHE: '1'
          UV_NO_PROGRESS: '1'
        run: |
          set -euo pipefail
          uv python install 3.13
          venv="$RUNNER_TEMP/kicad-pypi-clean"
          uv venv --python 3.13 "$venv"
          SMOKE_VERSION="$(uv run --no-project --python "$venv" python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          export SMOKE_VERSION
          if ! [[ "$SMOKE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable published version (MAJOR.MINOR.PATCH)." >&2
            exit 1
          fi
          uv pip install --python "$venv" "kicad-mcp-pro==$SMOKE_VERSION"
          uv run --no-project --python "$venv" python - <<'PYSMOKE'
          import asyncio
          import hashlib
          import importlib.metadata
          import os
          import shutil
          import sys
          import tempfile
          from pathlib import Path

          from mcp import ClientSession
          from mcp.client.stdio import StdioServerParameters, stdio_client

          expected_version = os.environ['SMOKE_VERSION']
          assert importlib.metadata.version('kicad-mcp-pro') == expected_version
          root = Path('tests/fixtures/benchmark_projects/pass_minimal_mcu_board')
          filenames = ('demo.kicad_pro', 'demo.kicad_sch', 'demo.kicad_pcb')
          before = {name: hashlib.sha256((root / name).read_bytes()).hexdigest()
                    for name in filenames}

          async def check_project(project: Path) -> None:
              env = dict(os.environ)
              env.update(KICAD_MCP_PROJECT_DIR=str(project),
                         KICAD_MCP_PROFILE='review',
                         KICAD_MCP_OPERATING_MODE='readonly')
              parameters = StdioServerParameters(
                  command=sys.executable,
                  args=['-m', 'kicad_mcp.server', '--transport', 'stdio',
                        '--profile', 'review', '--mode', 'readonly',
                        '--project-dir', str(project)],
                  env=env,
              )
              async with stdio_client(parameters) as streams:
                  async with ClientSession(*streams) as client:
                      info = await asyncio.wait_for(client.initialize(), timeout=45)
                      assert info.server_info.version == expected_version
                      tools = await asyncio.wait_for(client.list_tools(), timeout=45)
                      names = {tool.name for tool in tools.tools}
                      for tool_name in ('kicad_get_version', 'pcb_get_board_summary'):
                          assert tool_name in names, tool_name
                          response = await asyncio.wait_for(
                              client.call_tool(tool_name, {}), timeout=45)
                          assert not response.is_error, tool_name
                          assert response.content or response.structured_content, tool_name
                          if tool_name == 'pcb_get_board_summary':
                              # Tool-level success can still wrap a FAIL verdict.
                              report = response.structured_content
                              assert isinstance(report, dict), 'Missing structured board report'
                              metadata = report.get('metadata')
                              assert isinstance(metadata, dict), 'Missing board metadata'
                              assert report.get('verdict') in ('PASS', 'WARN'), report.get('verdict')
                              assert metadata.get('available') is True, 'PCB summary unavailable'
                              assert metadata.get('source') == 'file-backed', 'Unexpected board source'
                              assert metadata.get('footprints') == 3, 'Wrong fixture board'
                      print('PUBLISHED_PYPI_MCP_READONLY=PASS',
                            'platform=' + sys.platform,
                            'version=' + info.server_info.version)

          with tempfile.TemporaryDirectory(prefix='kicad-pypi-accept-') as tmp:
              project = Path(tmp)
              for name in filenames:
                  shutil.copyfile(root / name, project / name)
              asyncio.run(check_project(project))
              assert all(hashlib.sha256((project / name).read_bytes()).hexdigest()
                         == before[name] for name in filenames)
              print('COPIED_PROJECT_UNCHANGED=PASS')
              assert all(hashlib.sha256((root / name).read_bytes()).hexdigest()
                         == before[name] for name in filenames)
          print('ORIGINAL_FIXTURE_UNCHANGED=PASS')
          PYSMOKE
