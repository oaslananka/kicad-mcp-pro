name: KiCad 10.0.7 Windows Qualification

# Trusted post-merge and scheduled Windows native qualification; no PR/fork trigger.
# Operator dispatch remains available. Live GUI/IPC stays manual in its own workflow.
on:
  workflow_dispatch:
  # Weekly Tuesday 05:17 UTC, on the default branch only.
  schedule:
    - cron: "17 5 * * 2"
  push:
    branches: [main]
    # Bound installer downloads to changes that affect the native KiCad contract.
    paths:
      - ".github/workflows/kicad-10-0-7-windows-qualification.yml"
      - "scripts/kicad_canary.py"
      - "scripts/kicad_107_erc_units.py"
      - "scripts/kicad_107_flat_root_pdf.py"
      - "scripts/kicad_107_gerber_drill_marks.py"
      - "scripts/runtime_path_safety.py"
      - "src/kicad_mcp/evals/**"
      - "src/kicad_mcp/pcb/**"
      - "src/kicad_mcp/export/**"
      - "src/kicad_mcp/validation/**"
      - "src/kicad_mcp/tools/**"
      - "src/kicad_mcp/ipc/**"
      - "src/kicad_mcp/server_info.py"
      - "src/kicad_mcp/adapter_matrix.py"
      - "tests/fixtures/**"
      - "packages/kicad-fixtures/fixtures/**"
      - "examples/gallery/**"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

concurrency:
  group: win-kicad-107-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-windows-cli:
    name: Windows 10.0.7 CLI canary
    runs-on: windows-2025
    timeout-minutes: 65
    steps:
      - name: Checkout tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install project pinned uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version-file: uv.toml
          enable-cache: true
          prune-cache: true

      - name: Download and verify KiCad installer Authenticode
        shell: pwsh
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'kicad-10.0.7-x86_64.exe'
          # CERN and AARNet are mirrors listed on the official KiCad download
          # page. Download is bounded per mirror so a throttled route cannot
          # exhaust the hosted runner; a failed partial file is never executed.
          $sources = @(
            'https://kicad-downloads.s3.cern.ch/windows/stable/kicad-10.0.7-x86_64.exe',
            'https://mirror.aarnet.edu.au/pub/kicad/windows/stable/kicad-10.0.7-x86_64.exe'
          )
          $uri = $null
          foreach ($candidate in $sources) {
            if (Test-Path -LiteralPath $installer) {
              Remove-Item -LiteralPath $installer -Force
            }
            Write-Host "Trying official KiCad mirror: $candidate"
            & curl.exe --fail --location --retry 0 --connect-timeout 20 --max-time 420 --speed-limit 131072 --speed-time 60 --output $installer $candidate
            if ($LASTEXITCODE -eq 0 -and (Test-Path -LiteralPath $installer -PathType Leaf)) {
              $uri = $candidate
              break
            }
            Write-Warning "Mirror did not finish a full installer download; trying next official mirror"
          }
          if ($null -eq $uri) { throw 'All official KiCad mirrors failed to download the installer' }
          # Pin the previously qualified distribution bytes as well as the signer.
          # A mirror serving changed bytes must fail before the installer executes.
          $expectedSha256 = 'ce3881b6a9188eb34ac1ebaaec7651149e8a025206410addfb11a1a9656ecf95'
          $actualSha256 = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Unexpected KiCad 10.0.7 installer SHA-256: $actualSha256"
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate) {
            throw "Installer Authenticode invalid: $($signature.Status)"
          }
          if ($signature.SignerCertificate.Subject -notmatch '(?i)(?:CN|O)=.*KiCad') {
            throw 'Unexpected KiCad Authenticode signer'
          }
          New-Item -ItemType Directory -Force -Path 'artifacts/kicad-10-0-7-windows' | Out-Null
          [ordered]@{
            schemaVersion = 'windows-kicad-107-qualification.v1'
            sourceRevision = $env:SOURCE_REVISION
            installerVersion = '10.0.7'
            installerUrl = $uri
            installerSha256 = $actualSha256
            signatureStatus = [string]$signature.Status
            signerSubject = $signature.SignerCertificate.Subject
            signerIssuer = $signature.SignerCertificate.Issuer
            scope = 'Windows native CLI only; GUI/IPC and reference-board manufacturing not verified'
          } | ConvertTo-Json | Set-Content -Path 'artifacts/kicad-10-0-7-windows/provenance.json' -Encoding utf8
          "KICAD_107_INSTALLER=$installer" >> $env:GITHUB_ENV

      - name: Install isolated KiCad only on disposable runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:RUNNER_TEMP 'kicad-107-native-install'
          if (Test-Path -LiteralPath $target) { throw 'Isolated install target already exists' }
          $proc = Start-Process -FilePath $env:KICAD_107_INSTALLER -ArgumentList @('/S', '/currentuser', "/D=$target") -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "KiCad installer failed ($($proc.ExitCode))" }
          $cli = Join-Path $target 'bin/kicad-cli.exe'
          if (-not (Test-Path -LiteralPath $cli -PathType Leaf)) {
            throw 'Isolated CLI missing: cannot fall back to system KiCad'
          }
          # Do not pipe the native process directly to Select-Object -First:
          # it can close the native stdout pipe early and distort exit status.
          # Capture the entire native invocation and its exit code first.
          $versionLines = @(& $cli version)
          $versionExitCode = $LASTEXITCODE
          $version = ($versionLines | Select-Object -First 1).Trim()
          Write-Host "Native KiCad CLI reports '$version' (exit code $versionExitCode)"
          if ($versionExitCode -ne 0) {
            throw "Native KiCad CLI version invocation failed with exit code $versionExitCode"
          }
          if ($version -ne '10.0.7') {
            throw "Wrong KiCad CLI version: $version"
          }
          # The library parser does not discover an arbitrary NSIS /D path on
          # Windows. Bind both KiCad and kicad-sch-api to the SAME isolated
          # versioned symbol corpus used by the native CLI, or fail closed.
          $symbols = Join-Path $target 'share/kicad/symbols'
          $deviceSymbols = Join-Path $symbols 'Device.kicad_sym'
          if (-not (Test-Path -LiteralPath $symbols -PathType Container) -or
              -not (Test-Path -LiteralPath $deviceSymbols -PathType Leaf)) {
            throw 'Isolated KiCad 10.0.7 standard symbol libraries missing; cannot compare connectivity'
          }
          "KICAD_CANARY_KICAD_CLI=$cli" >> $env:GITHUB_ENV
          "KICAD_MCP_KICAD_CLI=$cli" >> $env:GITHUB_ENV
          "KICAD_SYMBOL_DIR=$symbols" >> $env:GITHUB_ENV
          "KICAD10_SYMBOL_DIR=$symbols" >> $env:GITHUB_ENV
          "KICAD_CONFIG_HOME=$(Join-Path $env:RUNNER_TEMP 'kicad-107-config')" >> $env:GITHUB_ENV

      - name: Sync locked Python dependencies
        run: uv sync --all-extras --frozen

      - name: Run full native Windows 10.0.7 CLI canary
        shell: pwsh
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          uv run --all-extras python scripts/kicad_canary.py run --artifacts artifacts/kicad-10-0-7-windows --kicad-range 10.0.x
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows canary failed' }
          $summary = Get-Content 'artifacts/kicad-10-0-7-windows/summary.json' -Raw | ConvertFrom-Json
          $diff = Get-Content 'artifacts/kicad-10-0-7-windows/differential/summary.json' -Raw | ConvertFrom-Json
          if ($summary.results.Count -ne 32 -or $summary.failingFixtures.Count -ne 0) { throw 'Incomplete native plan' }
          if (($summary.results | Where-Object { $_.ok -ne $true }).Count -gt 0) { throw 'Native step failed' }
          if ($diff.kicad_version -ne '10.0.7' -or $diff.source_sha -ne $env:SOURCE_REVISION) {
            throw 'Native KiCad version or exact-source evidence mismatch'
          }
          if ($diff.match_count -ne 5 -or $diff.results_total -ne 5) { throw 'Incomplete differential acceptance' }
          foreach ($key in @('false_pass_count', 'false_fail_count', 'divergence_count', 'infrastructure_invalid_count')) {
            if ($diff.$key -ne 0) { throw "Unsafe differential status: $key" }
          }
          Write-Output 'Native Windows 10.0.7 CLI canary passed: 32 planned steps, 5/5 semantic differentials'

      - name: Verify 10.0.7 ERC JSON unit-scale semantics
        shell: pwsh
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          uv run --all-extras python scripts/kicad_107_erc_units.py --output artifacts/kicad-10-0-7-windows/erc-units.json
          if ($LASTEXITCODE -ne 0) { throw 'Native KiCad 10.0.7 ERC JSON unit-scale regression failed' }
          $result = Get-Content 'artifacts/kicad-10-0-7-windows/erc-units.json' -Raw | ConvertFrom-Json
          if ($result.status -ne 'pass' -or $result.kicadVersion -ne '10.0.7' -or
              $result.sourceRevision -ne $env:SOURCE_REVISION) {
            throw 'ERC unit-scale report does not match the exact tested source'
          }

      - name: Verify 10.0.7 flat multi-root schematic PDF pages
        shell: pwsh
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          uv run --all-extras python scripts/kicad_107_flat_root_pdf.py --output artifacts/kicad-10-0-7-windows/flat-root-pdf.json
          if ($LASTEXITCODE -ne 0) { throw 'Native KiCad 10.0.7 flat multi-root PDF regression failed' }
          $result = Get-Content 'artifacts/kicad-10-0-7-windows/flat-root-pdf.json' -Raw | ConvertFrom-Json
          if ($result.status -ne 'pass' -or $result.kicadVersion -ne '10.0.7' -or
              $result.pageCount -ne 2 -or $result.sourceRevision -ne $env:SOURCE_REVISION) {
            throw 'Flat multi-root PDF report does not match expected exact-source contract'
          }

      - name: Verify 10.0.7 Gerber NPTH drill-mark exclusion
        shell: pwsh
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          uv run --all-extras python scripts/kicad_107_gerber_drill_marks.py --output artifacts/kicad-10-0-7-windows/gerber-drill-marks.json
          if ($LASTEXITCODE -ne 0) { throw 'Native KiCad 10.0.7 Gerber drill-mark regression failed' }
          $result = Get-Content 'artifacts/kicad-10-0-7-windows/gerber-drill-marks.json' -Raw | ConvertFrom-Json
          if ($result.status -ne 'pass' -or $result.kicadVersion -ne '10.0.7' -or
              $result.copperFlashCount.npth -ne 0 -or $result.copperFlashCount.pth -ne 1 -or
              $result.savedDrillMarkStyle -ne 'full' -or $result.sourceRevision -ne $env:SOURCE_REVISION) {
            throw 'Gerber drill-mark report does not match the exact-source native contract'
          }

      - name: Upload bounded Windows qualification artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kicad-10-0-7-windows-native
          path: artifacts/kicad-10-0-7-windows
          if-no-files-found: warn
          retention-days: 7

      - name: Clean up installer and isolated runner files
        if: always()
        shell: pwsh
        run: |
          foreach ($name in @('kicad-10.0.7-x86_64.exe', 'kicad-107-native-install', 'kicad-107-config')) {
            $path = Join-Path $env:RUNNER_TEMP $name
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction Stop
            }
          }
