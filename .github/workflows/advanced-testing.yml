name: Advanced QA & Testing

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/advanced/**"
      - "scripts/advanced_testing/**"
      - ".github/workflows/advanced-testing.yml"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/advanced/**"
      - "scripts/advanced_testing/**"
      - ".github/workflows/advanced-testing.yml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advanced-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  advanced-qa:
    if: github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Use the Python installed below, never a second download via uv.
      UV_PYTHON_PREFERENCE: only-system
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: true
          prune-cache: true
          version-file: uv.toml

      - name: Set up pinned Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: .python-version

      - name: Run Advanced Testing Pytest Suite
        run: uv run --all-extras pytest tests/advanced/ -v

      - name: Run Memory & Leak Profiling
        run: uv run --all-extras python scripts/advanced_testing/run_memory_profile.py --iterations 30 --output artifacts/advanced-testing/current/memory-profile.json

      - name: Run Lightweight API Load Benchmark (required)
        run: uv run --all-extras python scripts/advanced_testing/run_load_test.py --vus 10 --requests 100 --profile lightweight --enforce --output artifacts/advanced-testing/current/performance-benchmarks.json

      - name: Run KiCad Runtime Benchmark (diagnostic)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: uv run --all-extras python scripts/advanced_testing/run_load_test.py --vus 10 --requests 100 --profile runtime --output artifacts/advanced-testing/current/runtime-benchmarks.json

      - name: Collect QA Evidence & Generate Report
        if: ${{ !cancelled() }}
        run: uv run --all-extras python scripts/advanced_testing/report_collector.py

      - name: Publish Advanced QA Evidence Summary
        if: ${{ !cancelled() }}
        run: |
          report="artifacts/advanced-testing/$(git rev-parse --short HEAD)/report.md"
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Advanced QA report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Advanced QA Evidence Artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: advanced-qa-evidence
          path: artifacts/advanced-testing/
          retention-days: 14
          if-no-files-found: ignore
