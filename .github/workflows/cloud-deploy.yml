name: Cloud Deploy (Coolify)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cloud-production-coolify
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy approved Cloud main
    if: github.repository == 'oaslananka/kicad-mcp-pro' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact main CI and Cloud CI before loading production credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_deploy.py --verify-only --sha "$GITHUB_SHA"
      - name: Deploy via Coolify and verify the live SHA
        env:
          GH_TOKEN: ${{ github.token }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_CONFIG: main
          COOLIFY_ROLLBACK_AUTO: 'false'
        run: python3 scripts/cloud_deploy.py --sha "$GITHUB_SHA"
