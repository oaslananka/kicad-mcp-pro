name: KiCad 10.0.7 Windows GUI IPC Qualification

# Deliberately opt-in: KiCad 10 IPC requires a *running* PCB Editor GUI.
# Never run this on the owner's Windows workstation or as a PR side effect.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: win-kicad-107-gui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-107-gui-ipc:
    name: Windows 10.0.7 real PCB Editor / IPC smoke
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install project pinned uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version-file: uv.toml
          enable-cache: true
          prune-cache: true

      - name: Download and verify KiCad installer Authenticode
        shell: pwsh
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'kicad-10.0.7-x86_64.exe'
          # CERN and AARNet are mirrors listed on the official KiCad download
          # page. Download is bounded per mirror so a throttled route cannot
          # exhaust the hosted runner; a failed partial file is never executed.
          $sources = @(
            'https://kicad-downloads.s3.cern.ch/windows/stable/kicad-10.0.7-x86_64.exe',
            'https://mirror.aarnet.edu.au/pub/kicad/windows/stable/kicad-10.0.7-x86_64.exe'
          )
          $uri = $null
          foreach ($candidate in $sources) {
            if (Test-Path -LiteralPath $installer) {
              Remove-Item -LiteralPath $installer -Force
            }
            Write-Host "Trying official KiCad mirror: $candidate"
            & curl.exe --fail --location --retry 0 --connect-timeout 20 --max-time 420 --speed-limit 131072 --speed-time 60 --output $installer $candidate
            if ($LASTEXITCODE -eq 0 -and (Test-Path -LiteralPath $installer -PathType Leaf)) {
              $uri = $candidate
              break
            }
            Write-Warning "Mirror did not finish a full installer download; trying next official mirror"
          }
          if ($null -eq $uri) { throw 'All official KiCad mirrors failed to download the installer' }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate) {
            throw "Installer Authenticode invalid: $($signature.Status)"
          }
          if ($signature.SignerCertificate.Subject -notmatch '(?i)(?:CN|O)=.*KiCad') {
            throw 'Unexpected KiCad Authenticode signer'
          }
          New-Item -ItemType Directory -Force -Path 'artifacts/kicad-10-0-7-windows' | Out-Null
          [ordered]@{
            schemaVersion = 'windows-kicad-107-qualification.v1'
            sourceRevision = $env:SOURCE_REVISION
            installerVersion = '10.0.7'
            installerUrl = $uri
            installerSha256 = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
            signatureStatus = [string]$signature.Status
            signerSubject = $signature.SignerCertificate.Subject
            signerIssuer = $signature.SignerCertificate.Issuer
            scope = 'Windows GUI/IPC qualification attempt; no CLI semantic or autonomous manufacturing acceptance claim'
          } | ConvertTo-Json | Set-Content -Path 'artifacts/kicad-10-0-7-windows/provenance.json' -Encoding utf8
          "KICAD_107_INSTALLER=$installer" >> $env:GITHUB_ENV

      - name: Install isolated KiCad only on disposable runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:RUNNER_TEMP 'kicad-107-native-install'
          if (Test-Path -LiteralPath $target) { throw 'Isolated install target already exists' }
          $proc = Start-Process -FilePath $env:KICAD_107_INSTALLER -ArgumentList @('/S', '/currentuser', "/D=$target") -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "KiCad installer failed ($($proc.ExitCode))" }
          $cli = Join-Path $target 'bin/kicad-cli.exe'
          if (-not (Test-Path -LiteralPath $cli -PathType Leaf)) {
            throw 'Isolated CLI missing: cannot fall back to system KiCad'
          }
          # Do not pipe the native process directly to Select-Object -First:
          # it can close the native stdout pipe early and distort exit status.
          # Capture the entire native invocation and its exit code first.
          $versionLines = @(& $cli version)
          $versionExitCode = $LASTEXITCODE
          $version = ($versionLines | Select-Object -First 1).Trim()
          Write-Host "Native KiCad CLI reports '$version' (exit code $versionExitCode)"
          if ($versionExitCode -ne 0) {
            throw "Native KiCad CLI version invocation failed with exit code $versionExitCode"
          }
          if ($version -ne '10.0.7') {
            throw "Wrong KiCad CLI version: $version"
          }
          # The library parser does not discover an arbitrary NSIS /D path on
          # Windows. Bind both KiCad and kicad-sch-api to the SAME isolated
          # versioned symbol corpus used by the native CLI, or fail closed.
          $symbols = Join-Path $target 'share/kicad/symbols'
          $deviceSymbols = Join-Path $symbols 'Device.kicad_sym'
          if (-not (Test-Path -LiteralPath $symbols -PathType Container) -or
              -not (Test-Path -LiteralPath $deviceSymbols -PathType Leaf)) {
            throw 'Isolated KiCad 10.0.7 standard symbol libraries missing; cannot compare connectivity'
          }
          "KICAD_CANARY_KICAD_CLI=$cli" >> $env:GITHUB_ENV
          "KICAD_MCP_KICAD_CLI=$cli" >> $env:GITHUB_ENV
          "KICAD_SYMBOL_DIR=$symbols" >> $env:GITHUB_ENV
          "KICAD10_SYMBOL_DIR=$symbols" >> $env:GITHUB_ENV
          "KICAD_CONFIG_HOME=$(Join-Path $env:RUNNER_TEMP 'kicad-107-config')" >> $env:GITHUB_ENV

      - name: Prepare isolated GUI IPC preferences and disposable fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $configBase = $env:KICAD_CONFIG_HOME
          if (-not $configBase.StartsWith($env:RUNNER_TEMP, [StringComparison]::OrdinalIgnoreCase)) {
            throw 'Unsafe GUI configuration directory'
          }
          $versionConfig = Join-Path $configBase '10.0'
          New-Item -ItemType Directory -Force -Path $versionConfig | Out-Null
          $commonSettings = Join-Path $versionConfig 'kicad_common.json'
          if (Test-Path -LiteralPath $commonSettings) { throw 'Not an isolated clean KiCad config' }
          @{ api = @{ enable_server = $true } } |
            ConvertTo-Json -Depth 5 |
            Set-Content -LiteralPath $commonSettings -Encoding utf8
          $settings = Get-Content -LiteralPath $commonSettings -Raw | ConvertFrom-Json
          if ($settings.api.enable_server -ne $true) { throw 'Isolated IPC setting not enabled' }

          # KiCad 10 first-run GUI may block on choosing symbol/footprint
          # library tables. Provision BOTH from the same signed installer
          # into the disposable versioned profile, without any UI clicks or
          # reads from the runner/user's existing KiCad configuration.
          $installBin = Split-Path -Parent $env:KICAD_CANARY_KICAD_CLI
          $installRoot = Split-Path -Parent $installBin
          $templateRoot = Join-Path $installRoot 'share/kicad/template'
          $symbolRoot = Join-Path $installRoot 'share/kicad/symbols'
          $footprintRoot = Join-Path $installRoot 'share/kicad/footprints'
          foreach ($directory in @($templateRoot, $symbolRoot, $footprintRoot)) {
            if (-not (Test-Path -LiteralPath $directory -PathType Container)) {
              throw 'Signed isolated installation is missing standard KiCad library resources'
            }
          }
          foreach ($tableName in @('sym-lib-table', 'fp-lib-table')) {
            $source = Join-Path $templateRoot $tableName
            $destination = Join-Path $versionConfig $tableName
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Signed isolated installation is missing standard $tableName"
            }
            if (Test-Path -LiteralPath $destination) {
              throw "Isolated $tableName already exists before first-run provisioning"
            }
            Copy-Item -LiteralPath $source -Destination $destination -ErrorAction Stop
            $copied = Get-Item -LiteralPath $destination -ErrorAction Stop
            if ($copied.Length -eq 0 -or
                (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash -ne
                (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash) {
              throw "Default KiCad $tableName table integrity check failed"
            }
          }
          # Require KiCad 10's release-specific standard library paths;
          # do not accidentally load the runner's global KiCad libraries.
          "KICAD10_TEMPLATE_DIR=$templateRoot" >> $env:GITHUB_ENV
          "KICAD10_SYMBOL_DIR=$symbolRoot" >> $env:GITHUB_ENV
          "KICAD10_FOOTPRINT_DIR=$footprintRoot" >> $env:GITHUB_ENV
          "KICAD_107_FIRST_RUN_TABLES_READY=true" >> $env:GITHUB_ENV
          $installBin = Split-Path -Parent $env:KICAD_CANARY_KICAD_CLI
          $pcb = Join-Path $installBin 'pcbnew.exe'
          if (-not (Test-Path -LiteralPath $pcb -PathType Leaf)) { throw 'Signed isolated install lacks PCB Editor' }
          $documents = Join-Path $env:RUNNER_TEMP 'kicad-107-gui-documents'
          New-Item -ItemType Directory -Force -Path $documents | Out-Null
          "KICAD_DOCUMENTS_HOME=$documents" >> $env:GITHUB_ENV
          "KICAD_GUI_SMOKE_BIN_DIR=$installBin" >> $env:GITHUB_ENV
          "KICAD_MCP_ENABLE_GUI_SMOKE=1" >> $env:GITHUB_ENV
          "KICAD_MCP_GUI_SMOKE_REQUIRED=1" >> $env:GITHUB_ENV
          # Only the PCB Editor owns the KiCad 10 board IPC service.
          # Do not start the project manager or schematic editor in parallel:
          # a competing default pipe may connect to an editor without a board.
          "KICAD_GUI_SMOKE_PCB_ONLY=1" >> $env:GITHUB_ENV
          # Diagnoses hosted-runner desktop limitations without exposing
          # usernames, directories, window titles or other host metadata.
          $sessionId = [System.Diagnostics.Process]::GetCurrentProcess().SessionId
          $userInteractive = [Environment]::UserInteractive
          $explorerPresent = @(
            Get-Process -Name explorer -ErrorAction SilentlyContinue |
              Where-Object { $_.SessionId -eq $sessionId }
          ).Count -gt 0
          Write-Host "GUI desktop preflight: session0=$($sessionId -eq 0), userInteractive=$userInteractive, explorerPresent=$explorerPresent"
          "KICAD_GUI_SESSION_ZERO=$($sessionId -eq 0)" >> $env:GITHUB_ENV
          "KICAD_GUI_USER_INTERACTIVE=$userInteractive" >> $env:GITHUB_ENV
          "KICAD_GUI_EXPLORER_PRESENT=$explorerPresent" >> $env:GITHUB_ENV
          "KICAD_107_GUI_CONFIG_READY=true" >> $env:GITHUB_ENV

      - name: Sync frozen Python dependencies
        run: uv sync --all-extras --frozen

      - name: Exercise real Windows GUI IPC and MCP live-board tools
        shell: pwsh
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:KICAD_107_GUI_CONFIG_READY -ne 'true' -or
              $env:KICAD_107_FIRST_RUN_TABLES_READY -ne 'true') {
            throw 'GUI IPC and isolated library table preflight were skipped'
          }
          New-Item -ItemType Directory -Force -Path 'artifacts/kicad-10-0-7-gui-ipc' | Out-Null
          # Internal artifacts may contain paths/sensitive raw diagnostic logs:
          # publish only the explicitly sanitized summary below.
          $env:KICAD_GUI_SMOKE_ARTIFACTS = 'artifacts/kicad-10-0-7-gui-ipc/internal'
          uv run --all-extras python -m pytest -q tests/gui/test_kicad_gui_live_context.py --disable-warnings --junitxml=artifacts/kicad-10-0-7-gui-ipc/junit.xml
          $exit = $LASTEXITCODE
          $cases = @()
          $junit = 'artifacts/kicad-10-0-7-gui-ipc/junit.xml'
          if (Test-Path -LiteralPath $junit -PathType Leaf) {
            $result = [xml](Get-Content -LiteralPath $junit -Raw)
            $cases = @($result.testsuites.testsuite.testcase)
          }
          $failures = @($cases | Where-Object { $_.failure -or $_.error })
          $skips = @($cases | Where-Object { $_.skipped })
          $accepted = (
            $exit -eq 0 -and $cases.Count -eq 2 -and
            $failures.Count -eq 0 -and $skips.Count -eq 0
          )
          # Emit bounded, source-bound evidence even for a real failure.
          # Never upload JUnit contents, screenshot, raw logs or host paths.
          $verdict = if ($accepted) { 'pass' } else { 'fail' }
          $editor = $null
          $diag = Join-Path $env:KICAD_GUI_SMOKE_ARTIFACTS 'open-editors/editor-readiness.json'
          if (Test-Path -LiteralPath $diag -PathType Leaf) {
            $raw = Get-Content -LiteralPath $diag -Raw | ConvertFrom-Json
            $editor = [ordered]@{
              processRunning = [bool]$raw.processRunning
              processExitCode = $raw.processExitCode
              windowCount = [int]$raw.windowCount
              visibleWindowCount = [int]$raw.visibleWindowCount
              enabledVisibleWindowCount = [int]$raw.enabledVisibleWindowCount
              disabledVisibleWindowCount = [int]$raw.disabledVisibleWindowCount
              standardDialogWindowCount = [int]$raw.standardDialogWindowCount
              windowEnumerationFailed = [bool]$raw.windowEnumerationFailed
            }
          }
          [ordered]@{
            schemaVersion = 'windows-kicad-107-gui-ipc-qualification.v1'
            sourceRevision = $env:SOURCE_REVISION
            kicadVersion = '10.0.7'
            scope = 'actual PCB Editor GUI IPC / four live MCP tools and project switch only; no manufacturing success'
            runner = 'windows-2025'
            tests = @($cases | ForEach-Object { $_.name })
            testCount = $cases.Count
            failures = $failures.Count
            skips = $skips.Count
            verdict = $verdict
            editorReadiness = $editor
            desktop = [ordered]@{
              sessionZero = [System.Convert]::ToBoolean($env:KICAD_GUI_SESSION_ZERO)
              userInteractive = [System.Convert]::ToBoolean($env:KICAD_GUI_USER_INTERACTIVE)
              explorerPresent = [System.Convert]::ToBoolean($env:KICAD_GUI_EXPLORER_PRESENT)
            }
          } | ConvertTo-Json -Depth 4 |
            Set-Content -LiteralPath 'artifacts/kicad-10-0-7-gui-ipc/summary.json' -Encoding utf8
          if (-not $accepted) {
            throw "Actual Windows GUI / IPC MCP test failed: exit=$exit cases=$($cases.Count) failures=$($failures.Count) skips=$($skips.Count)"
          }
          Write-Output 'Actual KiCad 10.0.7 GUI IPC + MCP live-board switching passed'

      - name: Publish bounded non-sensitive qualification result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kicad-10-0-7-windows-gui-ipc
          path: artifacts/kicad-10-0-7-gui-ipc/summary.json
          if-no-files-found: warn
          retention-days: 7

      - name: Remove installer and disposable GUI configuration
        if: always()
        shell: pwsh
        run: |
          foreach ($name in @(
            'kicad-10.0.7-x86_64.exe',
            'kicad-107-native-install',
            'kicad-107-config',
            'kicad-107-gui-documents'
          )) {
            $path = Join-Path $env:RUNNER_TEMP $name
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction Stop
            }
          }
