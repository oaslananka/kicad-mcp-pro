name: CodSpeed

on:
  push:
    branches: [main]
  pull_request:
  # Lets CodSpeed trigger backtest runs to build initial performance history.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codspeed-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OpenID Connect authentication with CodSpeed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: true
          prune-cache: true
          version-file: uv.toml
      - run: uv sync --all-extras --frozen
      - name: Run benchmarks
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        with:
          mode: simulation
          run: uv run --frozen pytest benchmarks/ --codspeed -p no:cacheprovider
