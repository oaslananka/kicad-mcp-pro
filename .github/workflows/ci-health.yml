name: CI Health Report

on:
  workflow_dispatch:
  schedule:
    - cron: "47 5 * * 1"

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-health-report
  cancel-in-progress: false

jobs:
  report:
    if: github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Collect read-only GitHub CI run evidence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ci-health-jobs"
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?per_page=100" \
            > "${RUNNER_TEMP}/ci-health-runs.json"
          for run_id in $(jq -r '[.workflow_runs[] | select(.status == "completed") | .id][:12][]' "${RUNNER_TEMP}/ci-health-runs.json"); do
            [[ "$run_id" =~ ^[0-9]+$ ]]
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
              > "${RUNNER_TEMP}/ci-health-jobs/${run_id}.json"
          done
      - name: Summarize seven-day GitHub CI health
        run: |
          python3 scripts/ci_health_report.py \
            --runs-file "${RUNNER_TEMP}/ci-health-runs.json" \
            --jobs-dir "${RUNNER_TEMP}/ci-health-jobs"
      - name: Preserve audit snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-health-${{ github.run_id }}
          path: ci-health.json
          if-no-files-found: error
          retention-days: 14
