<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Review</title>
<style>
  :root {
    --bg: #0b0f17;
    --card: #131926;
    --border: #232d3f;
    --border-strong: #334155;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --text-dim: #64748b;
    --accent: #38bdf8;
    --error: #ef4444;
    --warn: #f59e0b;
    --ok: #22c55e;
    --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    padding: 20px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .container { max-width: 820px; margin: 0 auto; }
  .card {
    background: var(--card); border-radius: 10px; padding: 18px; margin-bottom: 16px;
    border: 1px solid var(--border); transition: border-color 0.15s ease;
  }
  .card:hover { border-color: var(--border-strong); }
  h2 { font-size: 0.95rem; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .summary-bar { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; }
  .summary-item { display: flex; align-items: center; gap: 8px; font-size: 0.88rem; color: var(--text-muted); }
  .badge {
    display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 4px;
    font-size: 0.72rem; font-weight: 700; font-family: var(--font-mono); letter-spacing: 0.02em;
  }
  .badge-error { background: rgba(239, 68, 68, 0.18); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.35); }
  .badge-warn { background: rgba(245, 158, 11, 0.18); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.35); }
  .badge-ok { background: rgba(34, 197, 94, 0.18); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.35); }

  .table-responsive { width: 100%; overflow-x: auto; margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  th {
    color: var(--text-dim); font-weight: 700; text-transform: uppercase;
    font-size: 0.72rem; letter-spacing: 0.06em; background: rgba(0,0,0,0.2);
  }
  tr:hover td { background: rgba(255,255,255,0.02); }
  .empty { text-align: center; color: var(--text-muted); padding: 36px 16px; font-size: 0.9rem; }
</style>
</head>
<body>
<main class="container">
  <div class="card">
    <h2>Issue Summary</h2>
    <div class="summary-bar" id="summaryBar">
      <div class="summary-item"><span class="badge badge-error" id="errorCount">0</span> Errors</div>
      <div class="summary-item"><span class="badge badge-warn" id="warnCount">0</span> Warnings</div>
      <div class="summary-item"><span class="badge badge-ok" id="okCount">0</span> Passed</div>
    </div>
  </div>

  <div class="card">
    <h2>Issues Details</h2>
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th scope="col" style="width:90px;">Severity</th>
            <th scope="col" style="width:140px;">Rule</th>
            <th scope="col" style="width:140px;">Location</th>
            <th scope="col">Description</th>
          </tr>
        </thead>
        <tbody id="issueTable">
          <tr><td colspan="4" class="empty">No diagnostic data — run ERC/DRC to inspect issues.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<script>
window.addEventListener('message', (event) => {
  if (event.data?.type === 'mcp-tool-result') {
    const text = event.data.result?.content?.[0]?.text;
    if (text) renderIssues(text);
  }
});

function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function renderIssues(data) {
  let issues = [];
  try { issues = JSON.parse(data); } catch { return; }

  if (!Array.isArray(issues) || issues.length === 0) return;

  const errors = issues.filter(i => (i.severity || '').toLowerCase() === 'error').length;
  const warnings = issues.filter(i => (i.severity || '').toLowerCase() === 'warning').length;
  const passed = issues.filter(i => (i.severity || '').toLowerCase() === 'ok' || i.status === 'pass').length;

  document.getElementById('errorCount').textContent = errors;
  document.getElementById('warnCount').textContent = warnings;
  document.getElementById('okCount').textContent = passed || '—';

  const tbody = document.getElementById('issueTable');
  tbody.innerHTML = '';
  const filtered = issues.filter(i => i.severity !== 'ok');
  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty" style="color:var(--ok);">✓ No issues found. Board passed all rules.</td></tr>';
    return;
  }
  for (const issue of filtered) {
    const sev = (issue.severity || '').toLowerCase();
    const isError = sev === 'error';
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><span class="badge badge-${isError ? 'error' : 'warn'}">${esc(sev.toUpperCase())}</span></td>
      <td style="font-family:var(--font-mono);font-size:0.8rem;">${esc(issue.rule || issue.name || '\u2014')}</td>
      <td style="font-family:var(--font-mono);font-size:0.8rem;color:var(--text-muted);">${esc(issue.location || issue.path || '\u2014')}</td>
      <td>${esc(issue.message || issue.description || '\u2014')}</td>`;
    tbody.appendChild(tr);
  }
}

// Request DRC report
window.parent.postMessage({
  type: 'call-tool',
  tool: 'kicad_run_drc',
  arguments: { format: 'json' }
}, '*');
</script>
</body>
</html>
