schemaVersion: 1
updated: '2026-07-03'
source: https://github.com/oaslananka/kicad-mcp-pro
kicad:
  primary: 10.0.x
  latestVerified: 10.0.4
  supported:
    - range: 10.0.x
      state: primary
      ci: required
      notes: Primary optimized KiCad CLI and file-format target.
    - range: 8.x
      state: deprecated
      ci: manual
      notes: >-
        File-level read and migration support only; removal requires a release
        note.
  preview:
    - range: 11.x
      state: preview
      ci: none
      ipcBackend: kicad-ipc-headless
      notes: >-
        KiCad 11 introduces kicad-cli api-server (headless IPC) eliminating the
        GUI requirement for live PCB/schematic mutations. The capability seam in
        ipc/capabilities.py gates this via KICAD_11_HEADLESS_IPC_MIN_VERSION=11.
        SWIG pcbnew bindings are forbidden (enforced by test_swig_guard.py).
  dropped:
    - range: 9.x
      reason: >-
        Upstream KiCad 9.x reached end of life after KiCad 10.0.0; removal is
        complete in the current 3.17.x release line and was introduced in the
        3.9.0 compatibility window.
      ci: none
      removalVersion: 3.9.0
  pcbImportWorkflows:
    reviewed: '2026-05-27'
    commandProbe: kicad-cli pcb import --help
    sources:
      cliReference: https://docs.kicad.org/10.0/en/cli/cli.html
      pcbEditorReference: https://docs.kicad.org/10.0/en/pcbnew/pcbnew.html
    formats:
      altium:
        status: supported
        extensionCommand: kicadstudio.importAltium
        cliFormat: altium
        evidence: KiCad 10 CLI import help advertises the format.
      allegro:
        status: blocked
        extensionCommand: kicadstudio.importAllegro
        cliFormat: allegro
        evidence: >-
          KiCad 10 PCB Editor supports Cadence Allegro .brd import, but KiCad 10
          CLI import help does not advertise --format allegro.
        fixture: >-
          packages/kicad-fixtures/fixtures/kicad-10-0-3-regressions/importers/allegro-capability-probe.json
      cadstar:
        status: supported
        extensionCommand: kicadstudio.importCadstar
        cliFormat: cadstar
        evidence: KiCad 10 CLI import help advertises the format.
      eagle:
        status: supported
        extensionCommand: kicadstudio.importEagle
        cliFormat: eagle
        evidence: KiCad 10 CLI import help advertises the format.
      fabmaster:
        status: supported
        extensionCommand: kicadstudio.importFabmaster
        cliFormat: fabmaster
        evidence: KiCad 10 CLI import help advertises the format.
      geda:
        status: probe-gated
        extensionCommand: kicadstudio.importGeda
        cliFormat: geda
        evidence: >-
          Existing extension command remains guarded by kicad-cli help because
          current stable CLI docs do not advertise gEDA in --format options.
      pads:
        status: supported
        extensionCommand: kicadstudio.importPads
        cliFormat: pads
        evidence: KiCad 10 CLI import help advertises the format.
      pcad:
        status: supported
        extensionCommand: kicadstudio.importPcad
        cliFormat: pcad
        evidence: KiCad 10 CLI import help advertises the format.
      solidworks:
        status: supported
        extensionCommand: kicadstudio.importSolidworks
        cliFormat: solidworks
        evidence: KiCad 10 CLI import help advertises the format.
kicad10FeatureParity:
  reviewed: '2026-06-26'
  baseline: 10.0.4
  primaryIssue: https://github.com/oaslananka/kicad-mcp-pro/issues/191
  documentation: docs/compatibility/kicad-10-0-4-feature-parity.md
  allowedStatuses:
    - supported
    - not-applicable
    - partial
    - blocked
    - future
  sources:
    releaseNotes: https://www.kicad.org/blog/2026/06/KiCad-10.0.4-Release/
    releaseTag: https://github.com/KiCad/kicad-source-mirror/releases/tag/10.0.4
    cliReference: https://docs.kicad.org/10.0/en/cli/cli.html
    pcbEditorReference: https://docs.kicad.org/10.0/en/pcbnew/pcbnew.html
    pcbnewDeprecation: https://dev-docs.kicad.org/en/apis-and-binding/pcbnew/
    nightlies: https://www.kicad.org/help/nightlies-and-rcs/
  surfaces:
    importers:
      altium:
        status: supported
        nativeSurface: kicad-cli pcb import --format altium
        productSurface: KiCad Studio extension command and MCP manufacturing probe
        evidence:
          - path:tests/integration/test_export_tools.py
          - path:tests/integration/test_manufacturing_tools.py
          - command:kicad-cli pcb import --help includes altium
        notes: Extension and MCP import paths are gated by CLI help before use.
      allegro:
        status: blocked
        nativeSurface: KiCad PCB Editor GUI Cadence Allegro .brd import
        productSurface: >-
          KiCad Studio extension command registered but hidden unless CLI
          support appears
        issue: https://github.com/oaslananka/kicad-mcp-pro/issues/179
        evidence:
          - path:tests/integration/test_export_tools.py
          - fixture:kicad-10-0-3-regressions
          - >-
            command:kicad-cli pcb import --help does not advertise allegro in
            KiCad 10.0.4
        notes: >-
          KiCad 10.0.4 still documents GUI Allegro import, but the stable CLI
          surface is not available.
      cadstar:
        status: supported
        nativeSurface: kicad-cli pcb import --format cadstar
        productSurface: KiCad Studio extension command
        evidence:
          - path:tests/integration/test_export_tools.py
          - command:kicad-cli pcb import --help includes cadstar
        notes: Command remains probe-gated like other importer workflows.
      eagle:
        status: supported
        nativeSurface: kicad-cli pcb import --format eagle
        productSurface: KiCad Studio extension command
        evidence:
          - path:tests/integration/test_export_tools.py
          - command:kicad-cli pcb import --help includes eagle
        notes: Command remains probe-gated like other importer workflows.
      fabmaster:
        status: supported
        nativeSurface: kicad-cli pcb import --format fabmaster
        productSurface: KiCad Studio extension command
        evidence:
          - path:tests/integration/test_export_tools.py
          - command:kicad-cli pcb import --help includes fabmaster
        notes: Command remains probe-gated like other importer workflows.
      geda_lepton:
        status: supported
        nativeSurface: kicad-cli pcb import --format geda when help advertises the token
        productSurface: KiCad Studio extension command and MCP manufacturing import
        evidence:
          - path:tests/integration/test_export_tools.py
          - path:tests/integration/test_manufacturing_tools.py
          - command:kicad-cli pcb import --help includes geda
        notes: >-
          The product treats gEDA/Lepton as supported only after capability
          probing passes.
      pads:
        status: supported
        nativeSurface: kicad-cli pcb import --format pads
        productSurface: >-
          KiCad Studio extension command, MCP manufacturing import, and the
          carried-forward KiCad 10.0.3 fixture probe
        evidence:
          - path:tests/unit/test_kicad_canary.py
          - path:tests/integration/test_manufacturing_tools.py
          - fixture:kicad-10-0-3-regressions
        notes: >-
          KiCad 10.x PADS importer regressions are covered by canary and
          carried-forward fixture metadata.
      pcad:
        status: supported
        nativeSurface: kicad-cli pcb import --format pcad
        productSurface: KiCad Studio extension command
        evidence:
          - path:tests/integration/test_export_tools.py
          - command:kicad-cli pcb import --help includes pcad
        notes: Command remains probe-gated like other importer workflows.
      solidworks:
        status: supported
        nativeSurface: kicad-cli pcb import --format solidworks
        productSurface: KiCad Studio extension command
        evidence:
          - path:tests/integration/test_export_tools.py
          - command:kicad-cli pcb import --help includes solidworks
        notes: Command remains probe-gated like other importer workflows.
    exports:
      gerber:
        status: supported
        nativeSurface: kicad-cli pcb export gerbers
        productSurface: MCP manufacturing package and extension export workflows
        evidence:
          - path:scripts/kicad_canary.py
          - path:tests/integration/test_export_tools.py
          - command:corepack pnpm run test:kicad-cli-contract
        notes: Primary KiCad canary requires Gerber export artifacts.
      drill:
        status: supported
        nativeSurface: kicad-cli pcb export drill
        productSurface: MCP manufacturing package and extension export workflows
        evidence:
          - path:scripts/kicad_canary.py
          - path:tests/integration/test_export_tools.py
          - command:corepack pnpm run test:kicad-cli-contract
        notes: Primary KiCad canary requires drill export artifacts.
      pdf:
        status: supported
        nativeSurface: kicad-cli sch export pdf and pcb export pdf
        productSurface: MCP schematic/PCB export and extension PDF commands
        evidence:
          - path:scripts/kicad_canary.py
          - path:tests/unit/test_kicad_canary.py
          - command:kicad-cli sch export pdf and pcb export pdf
        notes: Schematic and PCB PDF exports are part of the KiCad 10 canary plan.
      pcb_pdf_property_popup_suppression:
        status: supported
        nativeSurface: kicad-cli sch export pdf --exclude-pdf-property-popups
        productSurface: KiCad 10.x regression canary and fixture metadata
        evidence:
          - path:scripts/kicad_canary.py
          - path:tests/unit/test_kicad_canary.py
          - fixture:kicad-10-0-3-regressions
        notes: >-
          The KiCad 10.x CLI PDF property-popup flag has a dedicated canary
          probe backed by the 10.0.3 regression fixture.
      ipc2581:
        status: supported
        nativeSurface: kicad-cli pcb export ipc2581
        productSurface: KiCad Studio extension command and MCP export_ipc2581 tool
        evidence:
          - path:tests/integration/test_export_tools.py
          - path:tests/integration/test_pcb_export_validation_surface.py
          - path:tests/e2e/test_server.py
        notes: ODB++ remains capability-gated by KiCad CLI detection.
      step:
        status: supported
        nativeSurface: kicad-cli pcb export step
        productSurface: MCP export_step and export_3d_step tools
        evidence:
          - path:tests/integration/test_export_tools.py
          - path:tests/unit/test_release_hardening.py
          - path:scripts/kicad_canary.py
        notes: STEP is a release-gated 3D export with path-safety tests.
      stepz:
        status: supported
        nativeSurface: kicad-cli pcb export stpz (STEPZ/GZIP-compressed STEP)
        productSurface: MCP export_stepz tool; no VS Code command-palette surface
        evidence:
          - path:tests/integration/test_export_tools.py
          - path:tests/integration/test_pcb_export_validation_surface.py
          - path:tests/unit/test_server_info_contract.py
          - source:https://docs.kicad.org/10.0/en/cli/cli.html
        notes: >-
          KiCad documents the user-facing export as STEPZ while the CLI
          subcommand is stpz; the product exposes it through MCP for
          agent/headless workflows.
      xao:
        status: supported
        nativeSurface: kicad-cli pcb export xao
        productSurface: MCP export_xao tool; no VS Code command-palette surface
        evidence:
          - path:tests/integration/test_export_tools.py
          - path:tests/integration/test_pcb_export_validation_surface.py
          - path:tests/unit/test_server_info_contract.py
          - source:https://docs.kicad.org/10.0/en/cli/cli.html
        notes: >-
          XAO is exposed through MCP for headless interchange workflows rather
          than as a niche VS Code command.
    gui_editor:
      design_blocks:
        status: supported
        nativeSurface: KiCad 10 PCB Editor design block workflow
        productSurface: S-expression parser and MCP pcb_block_* tools
        evidence:
          - path:tests/integration/test_pcb_tools.py
          - path:docs/mcp/tools.md
        notes: >-
          Product support is headless and tool-oriented, not a replacement for
          the native GUI editor.
      graphical_drc_rule_editor:
        status: not-applicable
        nativeSurface: KiCad PCB Editor graphical DRC rule editor
        productSurface: Textual .kicad_dru guidance and diagnostics, not a GUI rule editor
        evidence:
          - path:docs/kicad10/graphical-drc.md
          - path:tests/unit/test_dru_utils.py
        notes: >-
          The native graphical editor remains a KiCad GUI feature outside
          extension/MCP ownership.
      variants:
        status: supported
        nativeSurface: KiCad 10 design variants
        productSurface: Extension variants view and MCP variant_* tools
        evidence:
          - path:tests/unit/test_variant_diff.py
          - path:tests/integration/test_export_tools.py
        notes: >-
          Variant listing, activation, BOM diffing, and export integration are
          covered.
      barcode_support:
        status: supported
        nativeSurface: KiCad 10 PCB Editor barcode tool
        productSurface: MCP pcb_add_barcode tool
        evidence:
          - path:tests/unit/test_kicad10_parity_tools.py
          - path:docs/mcp/tools.md
          - source:https://docs.kicad.org/10.0/en/pcbnew/pcbnew.html
        notes: >-
          Headless barcode insertion is supported; native visual editing remains
          in KiCad.
      time_domain_tuning:
        status: supported
        nativeSurface: KiCad 10 interactive time-domain tuning workflows
        productSurface: MCP route_tune_time_domain and tuning profile helpers
        evidence:
          - path:tests/unit/test_kicad10_parity_tools.py
          - path:tests/integration/test_routing_tools.py
        notes: >-
          Product support models and documents tuning intent for headless
          workflows; native interactive routing UX remains a KiCad GUI surface.
    ipc:
      kicad_python_ipc:
        status: supported
        nativeSurface: KiCad IPC API
        productSurface: MCP live context discovery and scheduled GUI smoke coverage
        evidence:
          - path:tests/gui/test_kicad_gui_live_context.py
          - path:docs/compatibility/kicad-10-to-11-migration.md
          - smoke:corepack pnpm run test:kicad-gui-smoke
        notes: >-
          IPC is the supported live-editor direction for KiCad 10 and KiCad 11
          readiness.
      swig_pcbnew_direct_dependency:
        status: blocked
        nativeSurface: Deprecated SWIG pcbnew Python bindings
        productSurface: Production direct pcbnew imports are forbidden
        issue: https://github.com/oaslananka/kicad-mcp-pro/issues/197
        evidence:
          - path:scripts/check_no_pcbnew.py
          - path:docs/compatibility/kicad-10-to-11-migration.md
          - source:https://dev-docs.kicad.org/en/apis-and-binding/pcbnew/
        notes: >-
          The guard blocks production reliance on an API planned for removal in
          KiCad 11.
    vscode_extension:
      status_surface:
        status: supported
        nativeSurface: Detected KiCad CLI version and command help
        productSurface: Status bar and command menu feature availability
        evidence:
          - path:tests/unit/test_server_info_contract.py
          - path:tests/unit/test_cli_diagnostics.py
        notes: >-
          The UI reports primary/deprecated/unsupported KiCad lines and
          feature-level gates.
      importer_command_gating:
        status: supported
        nativeSurface: kicad-cli pcb import --help
        productSurface: Command palette availability and deterministic unsupported warnings
        evidence:
          - path:tests/integration/test_export_tools.py
          - path:tests/integration/test_manufacturing_tools.py
        notes: Importer commands cannot run without the corresponding CLI token.
    mcp_server:
      server_info_capability_contract:
        status: supported
        nativeSurface: KiCad CLI and IPC runtime discovery
        productSurface: kicad_get_server_info compatibility and capability payload
        evidence:
          - path:tests/unit/test_server_info_contract.py
          - path:packages/protocol-schemas/test/index.test.ts
          - path:docs/mcp/api-reference.md
        notes: Server-info schema and generated docs are release-gated.
      empty_project_read_tools:
        status: partial
        nativeSurface: Empty KiCad 10.0.4 project files
        productSurface: File-backed MCP read tools and quality gates
        issue: https://github.com/oaslananka/kicad-mcp-pro/issues/228
        evidence:
          - path:tests/integration/test_pcb_tools.py
          - path:tests/integration/test_schematic_tools.py
        notes: >-
          Regression coverage is tracked separately so the parity matrix stays
          bounded.
      ipc_state_consistency:
        status: partial
        nativeSurface: KiCad IPC lifecycle
        productSurface: kicad_get_server_info and tool diagnostics
        issue: https://github.com/oaslananka/kicad-mcp-pro/issues/223
        evidence:
          - path:tests/unit/test_server_info_contract.py
          - path:tests/gui/test_kicad_gui_live_context.py
        notes: 'Issue #229 tracks additional lifecycle transition coverage.'
    release:
      vsix_provenance:
        status: supported
        nativeSurface: VS Code extension release artifact
        productSurface: VSIX checksum, SBOM, and artifact attestation workflow
        evidence:
          - path:.github/workflows/publish-python.yml
          - path:scripts/check-release-provenance.mjs
          - path:docs/release.md
        notes: Release provenance is validated by the release verification gate.
      wheel_provenance:
        status: supported
        nativeSurface: Python wheel and source distribution
        productSurface: PyPI trusted publishing, checksums, SBOM, and attestations
        evidence:
          - path:.github/workflows/publish-python.yml
          - path:tests/unit/test_release_hardening.py
          - path:docs/publishing.md
        notes: Release evidence is product-scoped for the Python package.
      npm_tarball_provenance:
        status: supported
        nativeSurface: npm launcher tarball
        productSurface: npm provenance, checksum verification, and SBOM workflow
        evidence:
          - path:.github/workflows/publish-npm.yml
          - path:scripts/check-release-provenance.mjs
          - path:docs/release.md
        notes: npm release evidence is tied to the version-linked MCP product.
  kicad11Readiness:
    protocol_upgrade:
      status: future
      nativeSurface: MCP protocol and KiCad 11 readiness
      productSurface: Protocol upgrade plan and KiCad 11 manual canary path
      issue: https://github.com/oaslananka/kicad-mcp-pro/issues/197
      evidence:
        - path:docs/compatibility/kicad-10-to-11-migration.md
        - command:corepack pnpm run test:kicad-cli-contract:future
      notes: >-
        KiCad 11 is intentionally separate from the KiCad 10.0.4
        release-blocking baseline.
    nightly_canary:
      status: supported
      nativeSurface: KiCad development-branch nightly CLI
      productSurface: Manual prerelease smoke command and scheduled canary metadata
      evidence:
        - path:scripts/kicad_canary.py
        - path:docs/compatibility/kicad-10-to-11-migration.md
        - command:corepack pnpm run test:kicad-cli-contract:nightly
      notes: >-
        Nightly runs remain non-release and do not change the stable support
        line.
    swig_removal_guard:
      status: supported
      nativeSurface: KiCad 11 planned removal of SWIG pcbnew bindings
      productSurface: Production direct-pcbnew import guard
      evidence:
        - path:scripts/check_no_pcbnew.py
        - path:tests/unit/test_compatibility_matrix.py
        - source:https://dev-docs.kicad.org/en/apis-and-binding/pcbnew/
      notes: >-
        The guard keeps KiCad 11 preparation independent from current KiCad 10
        parity.
kicadIpcReadiness:
  reviewed: '2026-05-26'
  sources:
    pcbnewDeprecation: https://dev-docs.kicad.org/en/apis-and-binding/pcbnew/
    commandLine: https://docs.kicad.org/master/en/cli/cli.html
    nightlies: https://www.kicad.org/help/nightlies-and-rcs/
  directPcbnewImports:
    policy: forbidden-in-production
    allowedPaths:
      - scripts/check_no_pcbnew.py
      - tests/**
  manualCanary:
    currentNightlyRange: 10.99.x
    releaseCandidateRange: 11.0.x
    currentNightlyCommand: corepack pnpm run test:kicad-cli-contract:nightly
    releaseCandidateCommand: corepack pnpm run test:kicad-cli-contract:future
  ipcApi:
    requiredFor:
      projectDiscovery:
        tools:
          - kicad_get_project_info
          - kicad_set_project
        canaryProbes:
          - version
          - path-with-spaces-board-stats
          - unicode-path-board-stats
        evidence:
          - tests/integration/test_project_library_surface.py
          - tests/unit/test_discovery.py
      pcbRead:
        tools:
          - pcb_get_board_summary
          - pcb_get_tracks
          - pcb_get_footprints
          - pcb_get_nets
        canaryProbes:
          - board-stats
          - path-with-spaces-board-stats
          - unicode-path-board-stats
        evidence:
          - tests/integration/test_pcb_tools.py
          - tests/gui/test_kicad_gui_live_context.py
      schematicRead:
        tools:
          - sch_get_symbols
          - sch_get_sheet_info
          - sch_get_net_names
        canaryProbes:
          - clean-erc
          - schematic-pdf
          - bom
          - netlist
        evidence:
          - tests/integration/test_schematic_tools.py
          - tests/integration/test_project_library_surface.py
      drc:
        tools:
          - run_drc
          - validate_design
          - check_design_for_manufacture
        canaryProbes:
          - clean-drc
          - dirty-drc
        evidence:
          - tests/integration/test_export_tools.py
          - tests/integration/test_pcb_export_validation_surface.py
      erc:
        tools:
          - run_erc
          - validate_design
          - schematic_quality_gate
        canaryProbes:
          - clean-erc
          - dirty-erc
        evidence:
          - tests/integration/test_export_tools.py
          - tests/integration/test_schematic_connectivity_gate.py
      export:
        tools:
          - export_gerber
          - export_drill
          - export_manufacturing_package
          - export_bom
          - export_netlist
        canaryProbes:
          - schematic-pdf
          - schematic-pdf-no-property-popups
          - pcb-pdf
          - pcb-svg
          - pcb-dxf
          - gerbers
          - drill
          - step
        evidence:
          - tests/integration/test_export_tools.py
          - tests/unit/test_kicad_canary.py
      diagnostics:
        tools:
          - kicad_get_version
          - kicad_get_server_info
          - kicad_help
        canaryProbes:
          - version
          - read-only-output-failure
        evidence:
          - tests/unit/test_server_info_contract.py
          - tests/unit/test_cli_diagnostics.py
