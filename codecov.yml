codecov:
  branch: main

coverage:
  precision: 2
  round: down
  range: 80..100
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: 90%
        threshold: 0%
        informational: false

comment:
  layout: "diff, flags, files"
  behavior: default
  require_changes: true
  require_base: false
  require_head: true

github_checks:
  annotations: true

flags:
  python-full:
    paths:
      - src/kicad_mcp/
    carryforward: false
